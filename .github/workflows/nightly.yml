# Медленная полоса: гейты, которые слишком тяжелы для каждого push.
#
# Сверки с оригиналом здесь НЕТ намеренно: ей нужны дампы живого 1.7.10 (~200 МБ), которых на раннере
# нет и быть не должно — это оснастка фазы порта, запускаемая человеком при расследовании расхождения
# (`gradlew test -Pgt6.oracle=<путь>`), а не постоянный гейт.
#
# ⚠️ Оба задания помечены continue-on-error: на CI-раннере они НИ РАЗУ не прогонялись
# (проект гоняет их локально), и калибровать красный/зелёный по догадке нельзя. Задания
# собирают логи и пишут сводку; человек читает и снимает continue-on-error по мере калибровки.
# Ложный красный на ночном прогоне обесценивает гейт быстрее, чем его отсутствие.
name: Nightly

on:
  schedule:
    # 03:17 UTC — не на круглом часе, чтобы не толкаться в общей очереди GitHub.
    - cron: '17 3 * * *'
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  datagen-drift:
    name: Datagen drift (runData must not change src/generated)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4

      # Датаген порождает ворлдген/энчанты. Закоммиченный выхлоп обязан совпадать с тем, что
      # порождает текущий код: расхождение = кто-то правил сгенерированное руками или сменил
      # генератор, не перегенерив.
      - name: Run datagen
        run: ./gradlew runData --no-daemon --stacktrace

      - name: Check for drift
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain src/generated)" ]; then
            echo "::warning::src/generated changed after runData — regenerate and commit."
            git --no-pager diff --stat src/generated
            git --no-pager diff src/generated | head -400
            exit 1
          fi
          echo "src/generated is in sync with the generators."

  dedicated-server-smoke:
    name: Dedicated server smoke boot
    runs-on: ubuntu-latest
    timeout-minutes: 120
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
      - uses: gradle/actions/setup-gradle@v4

      # Дедикейт — самая свежая и наименее наигранная часть порта (клиентские плечи в common-коде
      # роняли ВСЕ MTE). Судим механикой: сервер обязан дойти до «Done (…)» — то есть пережить
      # регистрацию, генерацию мира и все фазы загрузки GT6.
      - name: Prepare server directory
        run: |
          mkdir -p runserver
          echo "eula=true" > runserver/eula.txt

      # Сервер сам не завершается: поднимаем в фоне и глушим сразу, как только в логе появилось
      # «Done (» — иначе задание молотило бы до таймаута на каждом ночном прогоне.
      - name: Boot server and require "Done"
        run: |
          set -uo pipefail
          ./gradlew runServer --no-daemon --stacktrace > server_boot.log 2>&1 &
          GRADLE_PID=$!
          DEADLINE=$(( $(date +%s) + 2400 ))   # 40 минут: первая сборка тянет декомпиляцию MC
          BOOTED=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if grep -q 'Done (' server_boot.log 2>/dev/null; then BOOTED=1; break; fi
            if ! kill -0 "$GRADLE_PID" 2>/dev/null; then break; fi   # процесс умер раньше времени
            sleep 10
          done
          pkill -P "$GRADLE_PID" 2>/dev/null || true
          kill "$GRADLE_PID" 2>/dev/null || true
          wait "$GRADLE_PID" 2>/dev/null || true
          if [ "$BOOTED" -eq 1 ]; then
            echo "Server reached Done:"
            grep -m1 'Done (' server_boot.log
          else
            echo "::error::Server never reached 'Done (' — see the uploaded log."
            tail -200 server_boot.log
            exit 1
          fi
          # Явные признаки беды даже при успешном старте.
          if grep -qE 'Exception in thread|Caused by:|Crash report' server_boot.log; then
            echo "::warning::Server booted, but the log contains exceptions."
            grep -nE 'Exception in thread|Caused by:|Crash report' server_boot.log | head -40
          fi

      - name: Upload server logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-boot-${{ github.run_id }}
          path: |
            server_boot.log
            runserver/logs/**
            runserver/gregtech.log
          if-no-files-found: warn
          retention-days: 7
