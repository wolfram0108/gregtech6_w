# Проверка на ЧИСТОЙ машине — то, чего локальная сборка дать не может: другая ОС, пустой кэш,
# ничего, кроме содержимого репозитория.
#
# Два задания, идут параллельно:
#   build  — артефакт + механические гейты (чистота jar, счётчики отложенности);
#   server — выделенный сервер обязан подняться до «Done». Ловит класс, который не видит ни один
#            юнит-тест: тесты поднимают сервер без мира и без клиентской стороны, а ломался за
#            месяц именно дедикейт — трижды, и каждый раз это находила игра, а не проверки.
#
# Требование к раннеру: декомпиляция Minecraft идёт с -Xmx6G (gradle.properties), нужен раннер
# с >= 16 ГБ RAM. Кэш Gradle делает декомпиляцию попаданием в кэш на последующих прогонах.
name: CI

# ЗАПУСКАЕТСЯ РУКАМИ, а не на каждый коммит: работа идёт заходами, сборка гоняется локально, и
# автоматический прогон на push только дублировал бы её и слал шум. Здесь проверяется то, чего
# локальная сборка дать не может, — чистая машина другой ОС.
#   · кнопкой (Actions -> CI -> Run workflow), когда решено, что готово;
#   · автоматически на pull request — чужие правки проверяются до того, как их вливают.
on:
  workflow_dispatch:
  pull_request:

# Повторный запуск на той же ветке отменяет предыдущий: сборка дорогая (декомпиляция MC).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Тише лог и без демона: в одноразовом контейнере демон только жрёт память.
  GRADLE_ARGS: --no-daemon --stacktrace

jobs:
  build:
    name: Build artifact + guards
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew assemble $GRADLE_ARGS

      - name: Guard — jar purity (no net/minecraft, no cpw)
        run: python3 .github/ci/check_jar.py 'build/libs/*.jar'

      - name: Guard — deferral counters (PORT-TODO / SILENT-STUB)
        run: python3 .github/ci/check_markers.py

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: gregtech6-jar-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  server:
    name: Dedicated server boots
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare server directory
        run: |
          mkdir -p runserver
          echo "eula=true" > runserver/eula.txt

      # Сервер сам не завершается: поднимаем в фоне и глушим сразу, как только в логе появилось
      # «Done (» — иначе задание молотило бы до таймаута.
      - name: Boot server and require "Done"
        run: |
          set -uo pipefail
          ./gradlew runServer $GRADLE_ARGS > server_boot.log 2>&1 &
          GRADLE_PID=$!
          DEADLINE=$(( $(date +%s) + 2400 ))
          BOOTED=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if grep -q 'Done (' server_boot.log 2>/dev/null; then BOOTED=1; break; fi
            if ! kill -0 "$GRADLE_PID" 2>/dev/null; then break; fi
            sleep 10
          done
          pkill -P "$GRADLE_PID" 2>/dev/null || true
          kill "$GRADLE_PID" 2>/dev/null || true
          wait "$GRADLE_PID" 2>/dev/null || true
          if [ "$BOOTED" -eq 1 ]; then
            echo "Server reached Done:"
            grep -m1 'Done (' server_boot.log
          else
            echo "::error::Server never reached 'Done (' — see the uploaded log."
            tail -300 server_boot.log
            exit 1
          fi
          if grep -qE 'Exception in thread|Caused by:|Crash report' server_boot.log; then
            echo "::warning::Server booted, but the log contains exceptions."
            grep -nE 'Exception in thread|Caused by:|Crash report' server_boot.log | head -40
          fi

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-boot-${{ github.sha }}
          path: |
            server_boot.log
            runserver/logs/**
            runserver/gregtech.log
          if-no-files-found: warn
          retention-days: 14
