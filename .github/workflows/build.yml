# Runs on a clean machine with a fresh cache, which a local build cannot reproduce.
# The dedicated-server job matters because unit tests never boot a world or the client side.
name: CI

# Triggered manually, not on every commit: the build already runs locally each session, so
# an automatic run on push would just duplicate it; pull requests still trigger it automatically.
on:
  workflow_dispatch:
  pull_request:

# Re-running on the same branch cancels the previous run: decompiling Minecraft is expensive.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Quieter log and no daemon: in a throwaway container a daemon only wastes memory.
  GRADLE_ARGS: --no-daemon --stacktrace

jobs:
  build:
    name: Build artifact + guards
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Two JDKs: 25 runs Gradle itself, 17 is the actual build toolchain (Forge/NeoForge 1.20.1 targets Java 17).
      # Installing both explicitly avoids Gradle silently fetching toolchain 17 via foojay on every run.
      - name: Set up JDK 17 and 25
        uses: actions/setup-java@v4
        with:
          java-version: |
            17
            25
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Assemble
        run: ./gradlew assemble $GRADLE_ARGS

      - name: Guard — jar purity (no net/minecraft, no cpw)
        run: python3 .github/ci/check_jar.py 'build/libs/*.jar'

      - name: Guard — deferral counters (PORT-TODO / SILENT-STUB)
        run: python3 .github/ci/check_markers.py

      - name: Guard — dist purity (no client types in server-loaded classes)
        run: python3 .github/ci/check_dist.py

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: gregtech6-jar-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 14

  server:
    name: Dedicated server boots
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # Two JDKs: 25 runs Gradle itself, 17 is the actual build toolchain (Forge/NeoForge 1.20.1 targets Java 17).
      # Installing both explicitly avoids Gradle silently fetching toolchain 17 via foojay on every run.
      - name: Set up JDK 17 and 25
        uses: actions/setup-java@v4
        with:
          java-version: |
            17
            25
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare server directory
        run: |
          mkdir -p runserver
          echo "eula=true" > runserver/eula.txt

      # The server never exits on its own, so it is started in the background and killed as soon as
      # the log prints "Done ("; otherwise the job would run until it times out.
      - name: Boot server and require "Done"
        run: |
          set -uo pipefail
          ./gradlew runServer $GRADLE_ARGS > server_boot.log 2>&1 &
          GRADLE_PID=$!
          DEADLINE=$(( $(date +%s) + 2400 ))
          BOOTED=0
          while [ "$(date +%s)" -lt "$DEADLINE" ]; do
            if grep -q 'Done (' server_boot.log 2>/dev/null; then BOOTED=1; break; fi
            if ! kill -0 "$GRADLE_PID" 2>/dev/null; then break; fi
            sleep 10
          done
          pkill -P "$GRADLE_PID" 2>/dev/null || true
          kill "$GRADLE_PID" 2>/dev/null || true
          wait "$GRADLE_PID" 2>/dev/null || true
          if [ "$BOOTED" -eq 1 ]; then
            echo "Server reached Done:"
            grep -m1 'Done (' server_boot.log
          else
            echo "::error::Server never reached 'Done (' — see the uploaded log."
            tail -300 server_boot.log
            exit 1
          fi
          if grep -qE 'Exception in thread|Caused by:|Crash report' server_boot.log; then
            echo "::warning::Server booted, but the log contains exceptions."
            grep -nE 'Exception in thread|Caused by:|Crash report' server_boot.log | head -40
          fi

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: server-boot-${{ github.sha }}
          path: |
            server_boot.log
            runserver/logs/**
            runserver/gregtech.log
          if-no-files-found: warn
          retention-days: 14
