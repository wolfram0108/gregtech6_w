# Gated on the tag matching mod_version in gradle.properties, so the release cannot ship a build
# that was not actually the one tagged, and the jar must pass the same cleanliness gate as CI.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist, e.g. v6.0.0-alpha.1)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # id-token lets the run obtain an OIDC token and sign as this workflow; attestations lets the
  # provenance record be written to the repository's registry.
  id-token: write
  attestations: write
  # Reading CI runs and their artifacts: a release is built only from a commit CI already accepted.
  actions: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      # Two JDKs: 25 runs Gradle itself, 17 is the actual build toolchain (Forge/NeoForge 1.20.1 targets Java 17).
      # Installing both explicitly avoids Gradle silently fetching toolchain 17 via foojay on every run.
      - name: Set up JDK 17 and 25
        uses: actions/setup-java@v4
        with:
          java-version: |
            17
            25
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version and check tag agreement
        id: version
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$TAG" != "v$MOD_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match mod_version '$MOD_VERSION' (expected 'v$MOD_VERSION')."
            exit 1
          fi
          # alpha/beta/rc → pre-release
          if printf '%s' "$MOD_VERSION" | grep -Eqi '(alpha|beta|rc)'; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # A tag publishes only a commit whose CI run (build + dedicated server) succeeded.
      - name: Guard — the tagged commit passed CI
        id: ci
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="$(git rev-parse HEAD)"
          RUN="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --commit "$SHA" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -z "$RUN" ]; then
            echo "::error::No successful CI run (build.yml) for $SHA. Run CI on this commit before tagging it."
            exit 1
          fi
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "run=$RUN"  >> "$GITHUB_OUTPUT"

      - name: Assemble
        run: ./gradlew assemble --no-daemon --stacktrace

      - name: Guard — jar purity
        run: python3 .github/ci/check_jar.py 'build/libs/*.jar'

      # The published jar must equal the one CI built from the same commit, byte for byte.
      - name: Guard — same bytes as the CI build of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run download "${{ steps.ci.outputs.run }}" --repo "$GITHUB_REPOSITORY" -n "gregtech6-jar-${{ steps.ci.outputs.sha }}" -D ci-jar
          OURS="$(sha256sum build/libs/*.jar | cut -d' ' -f1)"
          THEIRS="$(sha256sum ci-jar/*.jar | cut -d' ' -f1)"
          if [ "$OURS" != "$THEIRS" ]; then
            echo "::error::Release jar $OURS differs from the CI jar $THEIRS of the same commit: the build is not reproducible."
            exit 1
          fi
          echo "reproducible: $OURS"

      # The checksum sits next to the jar so anyone downloading it can confirm the file arrived intact
      # and is the exact one this run produced.
      - name: Checksums
        run: |
          cd build/libs
          for f in *.jar; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256

      # Checksums only prove the file was not corrupted; this step has GitHub cryptographically attest
      # that this exact file was built by this exact workflow run, so verification needs no trust in the author.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'build/libs/*.jar'

      # The release body describes what changed, pulled from CHANGELOG.md as the single source of
      # truth; a version with no changelog entry blocks the release outright.
      - name: Build release notes from CHANGELOG
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 {found = 1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > changelog-section.md
          if [ ! -s changelog-section.md ]; then
            echo "::error::CHANGELOG.md has no section '## [$VERSION]' — release notes would be empty."
            exit 1
          fi
          {
            echo "Minecraft 1.20.1 · NeoForge 47.1.106 or newer · Java 17."
            echo
            echo "> ⚠️ **Alpha.** Playable, not finished. Worlds are not guaranteed to survive between"
            echo "> builds — see \"Known gaps\" in the README before using a world you care about."
            echo
            cat changelog-section.md
            echo
            echo "---"
            echo
            echo "<details><summary>Verifying this download, and how to report a defect</summary>"
            echo
            echo "An unofficial port of Gregorius Techneticies' GregTech 6, under LGPL-3.0-or-later."
            echo "Not affiliated with or endorsed by the upstream author — report problems here, not there."
            echo "Where every part of this jar comes from is set out in \`NOTICE\`, inside the jar."
            echo
            echo "Two independent checks, neither requiring you to trust me:"
            echo
            echo '```'
            echo "gh attestation verify gregtech6-$VERSION.jar --repo ${{ github.repository }}"
            echo '```'
            echo
            echo "confirms GitHub itself witnessed this exact file being built by this repository's"
            echo "release workflow from the tagged commit. And because the build is reproducible, you"
            echo "can check the claim yourself — build the tag and compare:"
            echo
            echo '```'
            echo "./gradlew assemble && sha256sum build/libs/*.jar"
            echo '```'
            echo
            echo "The result must equal the published \`.sha256\` byte for byte."
            echo
            echo "Report a defect with: what you did, what the 1.7.10 original does instead,"
            echo "single-player or dedicated server, fresh or old world, plus \`logs/latest.log\`"
            echo "and \`gregtech.log\`."
            echo
            echo "</details>"
          } > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # The Minecraft version is in the title because releases from both branches share one repository
          # feed, so the game version cannot be inferred from the version number alone.
          name: GregTech 6 for NeoForge ${{ steps.version.outputs.version }} — Minecraft 1.20.1
          prerelease: ${{ steps.version.outputs.prerelease }}
          body_path: release-notes.md
          files: |
            build/libs/*.jar
            build/libs/*.sha256
