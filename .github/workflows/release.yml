# Релиз по тегу: тег `v*` (например v6.0.0-alpha.1) собирает jar и публикует GitHub Release.
#
# Гейты до публикации:
#   1. тег обязан совпадать с mod_version из gradle.properties (иначе выпустим не то, что подписали);
#   2. jar обязан быть чист (тот же гейт, что в CI) — «в релиз не уходит то, что не грузится».
# alpha/beta/rc в версии → релиз помечается pre-release автоматически.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist, e.g. v6.0.0-alpha.1)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version and check tag agreement
        id: version
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$TAG" != "v$MOD_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match mod_version '$MOD_VERSION' (expected 'v$MOD_VERSION')."
            exit 1
          fi
          # alpha/beta/rc → pre-release
          if printf '%s' "$MOD_VERSION" | grep -Eqi '(alpha|beta|rc)'; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble
        run: ./gradlew assemble --no-daemon --stacktrace

      - name: Guard — jar purity
        run: python3 .github/ci/check_jar.py 'build/libs/*.jar'

      # Контрольная сумма кладётся рядом с jar: скачавший может убедиться, что файл дошёл целым и
      # именно тот, что собрал этот прогон.
      - name: Checksums
        run: |
          cd build/libs
          for f in *.jar; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: GregTech 6 for NeoForge ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
            build/libs/*.sha256
          body: |
            **GregTech 6 for NeoForge — ${{ steps.version.outputs.version }}**

            Minecraft 26.1.2 · NeoForge 26.1.2.77 · Java 25.

            > ⚠️ **Alpha.** Playable, not finished. Worlds are not guaranteed to survive between
            > builds, and some subsystems are ported but not individually verified — see the
            > "Known gaps" section of the README before using a world you care about.

            Report a defect with: what you did, what the 1.7.10 original does instead,
            single-player or dedicated server, fresh or old world, plus `logs/latest.log`
            and `gregtech.log`.
