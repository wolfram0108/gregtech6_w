# Релиз по тегу: тег `v*` (например v6.0.0-alpha.1) собирает jar и публикует GitHub Release.
#
# Гейты до публикации:
#   1. тег обязан совпадать с mod_version из gradle.properties (иначе выпустим не то, что подписали);
#   2. jar обязан быть чист (тот же гейт, что в CI) — «в релиз не уходит то, что не грузится».
# alpha/beta/rc в версии → релиз помечается pre-release автоматически.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist, e.g. v6.0.0-alpha.1)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Удостоверение происхождения артефакта (attestations, шаг ниже): id-token — чтобы прогон получил
  # OIDC-токен и подписался как ЭТОТ workflow, attestations — чтобы запись легла в реестр репозитория.
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version and check tag agreement
        id: version
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$TAG" != "v$MOD_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match mod_version '$MOD_VERSION' (expected 'v$MOD_VERSION')."
            exit 1
          fi
          # alpha/beta/rc → pre-release
          if printf '%s' "$MOD_VERSION" | grep -Eqi '(alpha|beta|rc)'; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble
        run: ./gradlew assemble --no-daemon --stacktrace

      - name: Guard — jar purity
        run: python3 .github/ci/check_jar.py 'build/libs/*.jar'

      # Контрольная сумма кладётся рядом с jar: скачавший может убедиться, что файл дошёл целым и
      # именно тот, что собрал этот прогон.
      - name: Checksums
        run: |
          cd build/libs
          for f in *.jar; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256

      # УДОСТОВЕРЕНИЕ ПРОИСХОЖДЕНИЯ. Контрольная сумма выше говорит только «файл дошёл целым»: она
      # лежит рядом с jar, и подделавший одно подделает и другое. Здесь GitHub криптографически
      # свидетельствует, что ИМЕННО ЭТОТ файл собран ЭТИМ workflow из ЭТОГО коммита. Подписантом
      # выступает GitHub, а не самодельный сертификат, поэтому проверка не требует доверия к автору:
      #     gh attestation verify gregtech6-<версия>.jar --repo wolfram0108/gregtech6_w
      # Стоит ПОСЛЕ контрольных сумм и ДО публикации: свидетельство привязано к содержимому файла,
      # значит файл после этого шага изменяться не должен.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'build/libs/*.jar'

      # Тело релиза — это ЧТО ИЗМЕНИЛОСЬ, а не как собрать. Раздел текущей версии берётся из
      # CHANGELOG.md как есть: один источник, никакого второго описания, которое разойдётся с первым.
      # Отсутствие раздела — отказ публиковать: релиз без changelog'а не выпускается.
      - name: Build release notes from CHANGELOG
        run: |
          VERSION='${{ steps.version.outputs.version }}'
          awk -v v="## [$VERSION]" '
            index($0, v) == 1 {found = 1; next}
            found && /^## \[/ {exit}
            found {print}
          ' CHANGELOG.md > changelog-section.md
          if [ ! -s changelog-section.md ]; then
            echo "::error::CHANGELOG.md has no section '## [$VERSION]' — release notes would be empty."
            exit 1
          fi
          {
            echo "Minecraft 26.1.2 · NeoForge 26.1.2.84 or newer · Java 25."
            echo
            echo "> ⚠️ **Alpha.** Playable, not finished. Worlds are not guaranteed to survive between"
            echo "> builds — see \"Known gaps\" in the README before using a world you care about."
            echo
            cat changelog-section.md
            echo
            echo "---"
            echo
            echo "<details><summary>Verifying this download, and how to report a defect</summary>"
            echo
            echo "An unofficial port of Gregorius Techneticies' GregTech 6, under LGPL-3.0-or-later."
            echo "Not affiliated with or endorsed by the upstream author — report problems here, not there."
            echo "Where every part of this jar comes from is set out in \`NOTICE\`, inside the jar."
            echo
            echo "Two independent checks, neither requiring you to trust me:"
            echo
            echo '```'
            echo "gh attestation verify gregtech6-$VERSION.jar --repo ${{ github.repository }}"
            echo '```'
            echo
            echo "confirms GitHub itself witnessed this exact file being built by this repository's"
            echo "release workflow from the tagged commit. And because the build is reproducible, you"
            echo "can check the claim yourself — build the tag and compare:"
            echo
            echo '```'
            echo "./gradlew assemble && sha256sum build/libs/*.jar"
            echo '```'
            echo
            echo "The result must equal the published \`.sha256\` byte for byte."
            echo
            echo "Report a defect with: what you did, what the 1.7.10 original does instead,"
            echo "single-player or dedicated server, fresh or old world, plus \`logs/latest.log\`"
            echo "and \`gregtech.log\`."
            echo
            echo "</details>"
          } > release-notes.md

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          # Версия игры — В ЗАГОЛОВКЕ: релизы принадлежат репозиторию, а не ветке, и в общем
          # списке /releases выпуски обеих веток идут вперемешку. Из номера версии человек
          # версию игры не вычитает — она обязана стоять в названии.
          name: GregTech 6 for NeoForge ${{ steps.version.outputs.version }} — Minecraft 26.1.2
          prerelease: ${{ steps.version.outputs.prerelease }}
          body_path: release-notes.md
          files: |
            build/libs/*.jar
            build/libs/*.sha256
