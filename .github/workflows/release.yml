# Релиз по тегу: тег `v*` (например v6.0.0-alpha.1) собирает jar и публикует GitHub Release.
#
# Гейты до публикации:
#   1. тег обязан совпадать с mod_version из gradle.properties (иначе выпустим не то, что подписали);
#   2. jar обязан быть чист (тот же гейт, что в CI) — «в релиз не уходит то, что не грузится».
# alpha/beta/rc в версии → релиз помечается pre-release автоматически.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release (must already exist, e.g. v6.0.0-alpha.1)'
        required: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  # Удостоверение происхождения артефакта (attestations, шаг ниже): id-token — чтобы прогон получил
  # OIDC-токен и подписался как ЭТОТ workflow, attestations — чтобы запись легла в реестр репозитория.
  id-token: write
  attestations: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Resolve version and check tag agreement
        id: version
        run: |
          set -euo pipefail
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          MOD_VERSION="$(sed -n 's/^mod_version=//p' gradle.properties | tr -d '\r')"
          echo "tag=$TAG"           >> "$GITHUB_OUTPUT"
          echo "version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          if [ "$TAG" != "v$MOD_VERSION" ]; then
            echo "::error::Tag '$TAG' does not match mod_version '$MOD_VERSION' (expected 'v$MOD_VERSION')."
            exit 1
          fi
          # alpha/beta/rc → pre-release
          if printf '%s' "$MOD_VERSION" | grep -Eqi '(alpha|beta|rc)'; then
            echo "prerelease=true"  >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Assemble
        run: ./gradlew assemble --no-daemon --stacktrace

      - name: Guard — jar purity
        run: python3 .github/ci/check_jar.py 'build/libs/*.jar'

      # Контрольная сумма кладётся рядом с jar: скачавший может убедиться, что файл дошёл целым и
      # именно тот, что собрал этот прогон.
      - name: Checksums
        run: |
          cd build/libs
          for f in *.jar; do sha256sum "$f" > "$f.sha256"; done
          cat *.sha256

      # УДОСТОВЕРЕНИЕ ПРОИСХОЖДЕНИЯ. Контрольная сумма выше говорит только «файл дошёл целым»: она
      # лежит рядом с jar, и подделавший одно подделает и другое. Здесь GitHub криптографически
      # свидетельствует, что ИМЕННО ЭТОТ файл собран ЭТИМ workflow из ЭТОГО коммита. Подписантом
      # выступает GitHub, а не самодельный сертификат, поэтому проверка не требует доверия к автору:
      #     gh attestation verify gregtech6-<версия>.jar --repo wolfram0108/gregtech6_w
      # Стоит ПОСЛЕ контрольных сумм и ДО публикации: свидетельство привязано к содержимому файла,
      # значит файл после этого шага изменяться не должен.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: 'build/libs/*.jar'

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: GregTech 6 for NeoForge ${{ steps.version.outputs.version }}
          prerelease: ${{ steps.version.outputs.prerelease }}
          generate_release_notes: true
          files: |
            build/libs/*.jar
            build/libs/*.sha256
          body: |
            **GregTech 6 for NeoForge — ${{ steps.version.outputs.version }}**

            Minecraft 26.1.2 · NeoForge 26.1.2.84 or newer · Java 25.

            An unofficial port of Gregorius Techneticies' GregTech 6, under LGPL-3.0-or-later.
            Not affiliated with or endorsed by the upstream author — report problems here, not there.
            Where every part of this jar comes from is set out in `NOTICE`, inside the jar.

            > ⚠️ **Alpha.** Playable, not finished. Worlds are not guaranteed to survive between
            > builds, and some subsystems are ported but not individually verified — see the
            > "Known gaps" section of the README before using a world you care about.

            **Verifying this download.** Two independent checks, neither requiring you to trust me:

            ```
            gh attestation verify gregtech6-${{ steps.version.outputs.version }}.jar \
               --repo ${{ github.repository }}
            ```

            confirms GitHub itself witnessed this exact file being built by this repository's release
            workflow from the tagged commit. And because the build is reproducible, you can check the
            claim yourself — build the tag and compare:

            ```
            ./gradlew assemble && sha256sum build/libs/*.jar
            ```

            The result must equal the published `.sha256` byte for byte.

            Report a defect with: what you did, what the 1.7.10 original does instead,
            single-player or dedicated server, fresh or old world, plus `logs/latest.log`
            and `gregtech.log`.
