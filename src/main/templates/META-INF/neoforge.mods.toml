# This is an example neoforge.mods.toml file. It contains the data relating to the loading mods.
# There are several mandatory fields (#mandatory), and many more that are optional (#optional).
# The overall format is standard TOML format, v0.5.0.
# Note that there are a couple of TOML lists in this file.
# Find more information on toml format here:  https://github.com/toml-lang/toml

# The license for you mod. This is mandatory metadata and allows for easier comprehension of your redistributive properties.
# Review your options at https://choosealicense.com/. All rights reserved is the default copyright stance, and is thus the default here.
license="${mod_license}"

# A URL to refer people to when problems occur with this mod
issueTrackerURL="https://github.com/wolfram0108/gregtech6_w/issues"

# A list of mods - how many allowed here is determined by the individual mod loader
[[mods]] #mandatory

# The modid of the mod
modId="${mod_id}" #mandatory

# The version number of the mod
version="${mod_version}" #mandatory

# A display name for the mod
displayName="${mod_name}" #mandatory

# A URL to query for updates for this mod. See the JSON update specification https://docs.neoforged.net/docs/misc/updatechecker/
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional

# A URL for the "homepage" for this mod, displayed in the mod UI
displayURL="https://github.com/wolfram0108/gregtech6_w"

# A file name (in the root of the mod JAR) containing a logo for display
#logoFile="examplemod.png" #optional



# The description text for the mod (multi line!) (#mandatory)
# Original author and provenance: attribution required for a derivative work (LGPL).
authors="Gregorius Techneticies (GregTech 6); NeoForge port by wolfram0108"
credits="Ported from GregTech 6 for Minecraft 1.7.10 by Gregorius Techneticies."

description='''
GregTech 6 ported to Minecraft 26.1.2 / NeoForge.

An industrial process mod: ores are materials with composition, melting points and by-products,
processed through chains of machines from a hand hammer up to multiblock reactors and pressurised
fluid logistics. Items, blocks, ore dictionary entries and recipes are generated procedurally from a
material x prefix matrix rather than declared one by one.

UNOFFICIAL PORT: a derivative work under LGPL-3.0-or-later, not affiliated with or endorsed by
Gregorius Techneticies or the GregTech 6 team. Report problems to this port, not to them.
Provenance of every shipped component is in NOTICE, inside this jar.

ALPHA: playable end to end, but not finished. Worlds are not guaranteed to survive updates.
'''

# F12 (decisions/F12-registration-lifecycle.md): GT6 is three native FML mods of the original author in one
# jar (GAPI/GAPI_POST/GT), each with its own @Mod(value=...) in its own class (gregapi.GT_API /
# gregapi.GT_API_Post / gregtech6.GregTech6). FMLJavaModLanguageProvider (fml-decompiled :53-61) marks
# @Mod(value=X) WITHOUT a matching [[mods]] entry for modId X as a dangling entrypoint — hence GAPI and
# GAPI_POST carry their own metadata entries here, mirroring the ${mod_id} (GT) entry above.
[[mods]] #mandatory
modId="gregapi" #mandatory
version="${mod_version}" #mandatory
displayName="Greg-API" #mandatory
description='''
Core API of GregTech 6. Part of the GregTech 6 distribution, not a separate mod.
'''

[[mods]] #mandatory
modId="gregapi_post" #mandatory
version="${mod_version}" #mandatory
displayName="Greg-API-Post" #mandatory
description='''
Late-loading half of the GregTech 6 core API. Part of the GregTech 6 distribution, not a separate mod.
'''

# F12 4.4: the content mod GT (gregtech.GT6_Main) now uses a real neo @Mod(value=gregtech), so its
# lifecycle (Loader_Fluids/Items/PrefixBlocks/...) is actually driven by the engine. It loads AFTER
# gregapi_post (the 1.7.10 original GT6_Main.java: dependencies="required-after:"+GAPI_POST).
[[mods]] #mandatory
modId="gregtech" #mandatory
version="${mod_version}" #mandatory
displayName="GregTech" #mandatory
description='''
Content of GregTech 6: materials, machines, worldgen, recipes. Part of the GregTech 6 distribution.
'''

# Evidence R7: {@code @Mod.depends()} on the Java side (gregapi.GT_API/GT_API_Post) does NOT set the load
# order — it only filters the entrypoint class by whether the modId is among the loaded mods
# (fml-decompiled net/neoforged/fml/javafmlmod/FMLJavaModLanguageProvider.java:33). The real order is
# built by {@code ModSorter} (fml-decompiled net/neoforged/fml/loading/ModSorter.java:194-208,
# {@code addDependency}) from the GRAPH assembled out of exactly these {@code [[dependencies.<owner>]]}
# sections: {@code ordering="BEFORE"} gives the edge owner->target (owner first), {@code ordering="AFTER"}
# gives the edge target->owner (owner later). The structural link of the original is reproduced 1:1 here
# (gregtech6/.../GT_API.java:109 {@code "required-before:"+GAPI_POST}, GT_API_Post.java:59
# {@code "required-after:"+GAPI}) — on both sides of the pair, as in the original.
[[dependencies.gregapi]]
    modId="gregapi_post"
    type="required"
    versionRange="[${mod_version},)"
    ordering="BEFORE"
    side="BOTH"

[[dependencies.gregapi_post]]
    modId="gregapi"
    type="required"
    versionRange="[${mod_version},)"
    ordering="AFTER"
    side="BOTH"

# The GT mod loads AFTER gregapi_post (ordering=AFTER gives the edge gregapi_post->gregtech in ModSorter).
[[dependencies.gregtech]]
    modId="gregapi_post"
    type="required"
    versionRange="[${mod_version},)"
    ordering="AFTER"
    side="BOTH"

# BUG-099: the ONLY injection this mod makes into engine code (F2 — the replacement for the original
# coremod transformers). It restores the position of an item on the crafting grid, which the 26.1.2 engine
# discards before the recipe is called.
[[mixins]]
config="gregapi.mixins.json"

# The [[accessTransformers]] block allows you to declare where your AT file is.
# If this block is omitted, a fallback attempt will be made to load an AT from META-INF/accesstransformer.cfg
#[[accessTransformers]]
#file="META-INF/accesstransformer.cfg"

# The coremods config file path is not configurable and is always loaded from META-INF/coremods.json

# A dependency - use the . to indicate dependency for a specific modid. Dependencies are optional.
[[dependencies.${mod_id}]] #optional
    # the modid of the dependency
    modId="neoforge" #mandatory
    # The type of the dependency. Can be one of "required", "optional", "incompatible" or "discouraged" (case insensitive).
    # 'required' requires the mod to exist, 'optional' does not
    # 'incompatible' will prevent the game from loading when the mod exists, and 'discouraged' will show a warning
    type="required" #mandatory
    # Optional field describing why the dependency is required or why it is incompatible
    # reason="..."
    # The version range of the dependency
    versionRange="[${neo_version},)" #mandatory
    # An ordering relationship for the dependency.
    # BEFORE - This mod is loaded BEFORE the dependency
    # AFTER - This mod is loaded AFTER the dependency
    ordering="NONE"
    # Side this dependency is applied on - BOTH, CLIENT, or SERVER
    side="BOTH"

# Here's another dependency
[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    # This version range declares a minimum of the current minecraft version up to but not including the next major version
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"

# AE2 — optional dependency of the compatibility layer (ADAPT-017...020). HISTORY OF THIS EDGE:
# ordering=AFTER used to be load-bearing while the remove file ae2:has_meteorites lived in the mod's MAIN
# datapack — tags are applied in mod-pack order (ResourcePackLoader.findResourcePacks ->
# ModList.getModFiles, LinkedHashMap), and a file takes the place of the FIRST of its mods in the sorted
# order (ModSorter.java:191 — map+distinct), so the edge had to be declared on ALL FOUR of our mods (with
# the edge on gregtech6 alone, gregapi surfaced before ae2 — confirmed by a run). With the master key
# ae2/ReplaceMeteoriteGeneration the remove file moved into the conditional built-in pack ae2replacegen
# (GT_API.onAddPackFinders, Pack.Position.TOP — above mod packs regardless of their sorting), so for the
# tag the edge is no longer load-bearing. It is kept as insurance: any FUTURE file under data/ae2/** in the
# main pack would depend on that order again, and then the edge must be present on all four.
[[dependencies.${mod_id}]]
    modId="ae2"
    type="optional"
    versionRange="[26.1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.gregapi]]
    modId="ae2"
    type="optional"
    versionRange="[26.1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.gregapi_post]]
    modId="ae2"
    type="optional"
    versionRange="[26.1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.gregtech]]
    modId="ae2"
    type="optional"
    versionRange="[26.1.0,)"
    ordering="AFTER"
    side="BOTH"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features.${mod_id}]
#openGLVersion="[3.2,)"

# More Red — optional dependency of the adaptation layer. This edge IS load-bearing: the adaptation
# disables the mod's recipes through files under data/morered/recipe/**, and pack files are applied in mod
# order, so our pack must come AFTER the mod. The edge is declared on ALL FOUR of our mods — the order is
# decided by the first of them (the same reason as for the ae2 dependency above).
[[dependencies.${mod_id}]]
    modId="morered"
    type="optional"
    versionRange="[26.1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.gregapi]]
    modId="morered"
    type="optional"
    versionRange="[26.1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.gregapi_post]]
    modId="morered"
    type="optional"
    versionRange="[26.1.0,)"
    ordering="AFTER"
    side="BOTH"

[[dependencies.gregtech]]
    modId="morered"
    type="optional"
    versionRange="[26.1.0,)"
    ordering="AFTER"
    side="BOTH"
