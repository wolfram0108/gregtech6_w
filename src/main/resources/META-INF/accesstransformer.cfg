# GregTech 6 — Access Transformer ветки 1.20.1 (Forge).
# Прямой наследник gregtech_at.cfg оригинала 1.7.10 (FMLAT): тот же приём, тот же синтаксис,
# меняются лишь имена членов. Файл находится сборкой автоматически (build.gradle:177 —
# "Access Transformers are automatically detected").
#
# ИМЕНА — SRG (f_XXXXX_), не mojmap. Обоснование механическое, не по памяти:
#   * шаг применения AT в конвейере NeoForm Runtime для 1.20.1 — transformSources (JST), его вход
#     = applyNeoforgePatches над SRG-исходниками, и только СЛЕДУЮЩИЙ шаг remapSrgSourcesToOfficial
#     переводит их в mojmap (кэш NFRT: intermediate_results/transformSources_c23aa1eb….txt →
#     remapSrgSourcesToOfficial_df7ede29….txt, поле "sources" ссылается на выход transformSources);
#   * собственный AT Forge 1.20.1 (forge-1.20.1-47.4.22-userdev.jar!ats/accesstransformer.cfg:1)
#     записан в SRG и попадает в тот же шаг;
#   * живой образец этой же версии — Applied-Energistics-2-1.20.1
#     src/main/resources/META-INF/accesstransformer.cfg:31-32:
#         public-f net.minecraft.world.inventory.Slot f_40220_ # x
#         public-f net.minecraft.world.inventory.Slot f_40221_ # y
#     — тот же модификатор `public-f`, SRG-имя поля, named-имя в комментарии.
# SRG-имена взяты из маппингов сборки build/moddev/artifacts/namedToIntermediate.tsrg
# (класс net/minecraft/world/item/Item: maxDamage f_41371_, maxStackSize f_41370_).

# ST.setMaxDamage / ST.setMaxStackSize — канон GT6: мод меняет прочность и предел стека ЧУЖИХ
# (ванильных и форейн) предметов в рантайме. В 1.7.10 это делали публичные Item.setMaxDamage(int)/
# setMaxStackSize(int); в 1.20.1 оба поля private final (forge-1201-decompiled
# net/minecraft/world/item/Item.java:63-64) и сеттеров нет.
public-f net.minecraft.world.item.Item f_41370_ # maxStackSize
public-f net.minecraft.world.item.Item f_41371_ # maxDamage

# ST.set / ST.setItem — ЦЕНТР in-place смены Item у СУЩЕСТВУЮЩЕГО стека. В 1.7.10 это был публичный
# ItemStack.func_150996_a(Item) (recompSrc net/minecraft/item/ItemStack.java:895-899), писавший пару
# полей: `this.delegate = item.delegate; this.field_151002_e = item;`. В 1.20.1 пара формально та же
# (ItemStack.java:85 delegate + :112 item), но носитель ЛИЧНОСТИ ровно один — delegate:
#   * getItem() = `this.delegate.get()` (ItemStack.java:217), isEmpty() тоже по delegate (:192);
#   * поле item внутри самого ItemStack не читается вовсе — кормод Forge переписывает КАЖДОЕ его
#     обращение на вызов getItem(): forge-1.20.1-47.4.22-universal.jar!coremods/field_to_method.js,
#     секция 'itemstack' — redirectFieldToMethod(f_41589_ -> m_41720_).
# Поэтому f_41589_ здесь НЕ открывается: ASMAPI.redirectFieldToMethod требует, чтобы поле осталось
# private, и `public-f` на нём валит сам трансформ (проверено прогоном: ERROR «Field item is not
# private and an instance field», CoreModBaseTransformer). Пишем ТОЛЬКО delegate.
# SRG-имени у delegate нет: поле добавлено Forge (patches/…/ItemStack.java.patch:15), а на шаге
# transformSources ванильные члены уже в SRG, добавленные же Forge сохраняют исходные имена
# (в том же патче рядом стоят f_41587_/m_41619_). Рефлексии здесь больше нет — как у Item.maxDamage выше.
public-f net.minecraft.world.item.ItemStack delegate # delegate (добавлено Forge, SRG-имени нет)

# WD.setResistance — ЦЕНТР runtime-правки взрывоустойчивости ЧУЖОГО блока (1.7.10 Block.setResistance(float),
# GT усиливает ванильные блоки: Loader_BlockResistance:40-54, 15 ванильных блоков). В 1.20.1 поле
# protected final float (BlockBehaviour.java:81), сеттера нет, а читается оно живьём —
# Block.getExplosionResistance() → `return this.explosionResistance` (Block.java:336-337).
public-f net.minecraft.world.level.block.state.BlockBehaviour f_60444_ # explosionResistance

# WD.chunkNow / WD.teNonForcing — ЦЕНТР лок-фри чтения чанка (правка №2, BUG-106: грузящий
# Level.getChunk ставил unknown-тикет на КАЖДЫЙ вызов). Единственный путь без тикета и без
# thread-гейта — chunkMap.getVisibleChunkIfPresent, в 1.20.1 он protected
# (forge-1201-decompiled net/minecraft/server/level/ChunkMap.java:237). Публичной альтернативы
# нет: ServerChunkCache.getChunkNow отсекает не-main-поток (ServerChunkCache.java:183), из-за
# чего динамический свет BE на сервере был бы мёртв. SRG-имя — namedToIntermediate.tsrg.
public net.minecraft.server.level.ChunkMap m_140327_(J)Lnet/minecraft/server/level/ChunkHolder; # getVisibleChunkIfPresent

