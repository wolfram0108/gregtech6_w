# Names here are SRG, not mojmap, because this branch's toolchain applies access transformers to SRG sources
# before the later remap-to-mojmap step; Forge's own bundled AT and AE2's live example use the same convention.

# GT6 mutates durability and stack-size limits of foreign items at runtime.
# Both fields are private final on 1.20.1, unlike 1.7.10's public setters.
public-f net.minecraft.world.item.Item f_41370_ # maxStackSize
public-f net.minecraft.world.item.Item f_41371_ # maxDamage

# Identity's sole real carrier here is the delegate field; the parallel item field is unread by the engine at all
# (a coremod rewrites every access to getItem() instead), and opening it would make this very transform fail.
public-f net.minecraft.world.item.ItemStack delegate # delegate was added by Forge itself and has no SRG name.

# GT6 mutates a foreign block's explosion resistance at runtime; the field is protected final on 1.20.1, with no setter.
# Block.getExplosionResistance() → `return this.explosionResistance` (Block.java:336-337).
public-f net.minecraft.world.level.block.state.BlockBehaviour f_60444_ # explosionResistance

# The only path to read a chunk without forcing a load ticket is a protected chunk-map method with no public
# alternative; the usual substitute rejects any non-main-thread caller, which would kill server-side dynamic BE lighting.
public net.minecraft.server.level.ChunkMap m_140327_(J)Lnet/minecraft/server/level/ChunkHolder; # getVisibleChunkIfPresent

# Floating in oil while holding jump mirrors how the engine already lifts a swimmer.
# The signal is a protected field with no public getter anywhere, hence opened here.
public-f net.minecraft.world.entity.LivingEntity f_20899_ # jumping
