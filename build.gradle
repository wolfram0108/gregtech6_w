plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    // Шаблон считается ОТ КОРНЯ ресурсного каталога, а не от корня проекта, поэтому прежний
    // "src/generated/**/.cache" не срабатывал: кэш датагена уезжал в jar (найдено сверкой артефакта
    // из чистого клона с локальным — у постороннего jar оказался чище на 4 записи).
    exclude("**/.cache/**")
}

// F10 (decisions/F10-external-mod-compat.md §3.2): ЦЕНТРАЛЬНОЕ ЗЕРКАЛО чужих API — единственная точка,
// где живут compile-only декларации интерфейсов внешних модов (IC2/AE2/…), которые GregTech6 реализует.
// Держит ядро компилируемым, пока интеграция с модами ОТЛОЖЕНА. Возврат к реальной интеграции = удалить
// этот каталог и подключить настоящие зависимости — в ОДНОМ месте. Аналог compileOnly dev-jar'ов оракула.
sourceSets.main.java.srcDir('src/compat-mirror/java')

// Режим -PcoreOnly СНЯТ вместе с фазой массовой компиляции, которую он обслуживал: он сужал сборку до
// ядра по двум спискам файлов, потому что контент-слой тогда ещё не компилировался. Контент собирается,
// фаза закрыта — режим и его списки (core_unit_v2_files.txt, mirror_files.txt) убраны из репозитория.

// Режим -PparityFull СНЯТ: он был третьим способом сказать «сверить с оригиналом» и после разделения
// режимов (см. блок test ниже) только путал. Сверка включается наличием пути к дампам оригинала:
//     gradlew test -Pgt6.oracle=<путь>

// runClient/runData/runServer (module-режим дев-запуска): те же JPMS split-package crutch-классы
// (net.minecraft.*/cpw.* из compat-mirror, зона F10), что и в test, конфликтуют с модулями minecraft/jei при
// module-resolution (ResolutionException «Modules minecraft and gregtech6 export package net.minecraft.*»).
// Стрипаем их из рантайм-вывода build/classes/java/main ПОСЛЕ compile, ДО запуска — ровно как stripMcMirror
// для test. Рантайм GT6 их не зовёт: render-shim'ы (IIcon/IIconRegister/RenderBlocks) superseded пайплайном
// GT6BlockModel (baked-модели), server-путь доказан parity-тестом. Если рантайм всё же дёрнет конкретный
// класс → точечный NoClassDefFound укажет его, тогда адаптируем адресно. incremental=false: strip удаляет
// .class из вывода, инкрементальная компиляция на след. прогоне путается («package does not exist») —
// полная компиляция регенерит миражи каждый раз, strip снова удаляет → консистентно.
tasks.named('compileJava').configure { options.incremental = false }
// ОДНА задача на весь проект: и дев-запуски, и тесты снимают одни и те же crutch-классы из одного и
// того же вывода. Прежде копий было две (для run* и для test) — и они разошлись: тестовая умела
// configuration cache, запусковая нет, из-за чего любой дев-запуск падал на кэше конфигурации.
// Пути вычисляются НА КОНФИГУРАЦИИ: обращение к file()/project внутри doLast несовместимо с кэшем.
def mirrorDirs = ['net/minecraft', 'cpw'].collect { file("build/classes/java/main/$it") }
def stripCompatMirror = tasks.register('stripCompatMirror') {
    description = 'Снять compile-only зеркала (net.minecraft, cpw) из рантайм-вывода: их пакетами владеет движок'
    doLast {
        int removed = 0
        mirrorDirs.each { d ->
            if (d.exists()) {
                d.eachFileRecurse { if (it.isFile()) removed++ }
                d.deleteDir()
            }
        }
        println("[strip] снято ${removed} crutch-.class из рантайм-модуля")
    }
}
stripCompatMirror.configure { mustRunAfter tasks.named('classes') }
['runClient', 'runData', 'runServer', 'runGameTestServer'].each { rn ->
    tasks.matching { it.name == rn }.configureEach { dependsOn stripCompatMirror }
}
tasks.named('test').configure { dependsOn stripCompatMirror }

// РУБИЛЬНИК отладочных проб (CS.probeFlag): файлы-флаги в run/ работают ТОЛЬКО при запуске с -Pgt6probes
// (запуски оркестратора: `gradlew runClient -Pgt6probes …`). Обычный запуск игрока — пробы/автовход-в-мир
// мертвы, даже если флаг случайно остался (класс сбоя «стухший флаг портит игровой запуск» закрыт механически).
if (project.hasProperty('gt6probes')) {
    // ОСНАСТКА ПРОВЕРКИ — два каталога, подключаемые одной строкой каждый (тот же приём, что
    // src/compat-mirror/java выше). В обычной сборке (jar игрока) они НЕ КОМПИЛИРУЮТСЯ ВООБЩЕ — их нет
    // в classpath, значит нет и в jar. Обе оснастки автономны: подписываются на события сами
    // (@EventBusSubscriber), production-код о них не знает ни строчкой.
    sourceSets.main.java.srcDir('src/probes/java')     // живые стенды (ручная проверка в работающей игре)
    sourceSets.main.java.srcDir('src/gametest/java')   // GameTest'ы движка (runGameTestServer)
    ['runClient', 'runData', 'runServer', 'runGameTestServer'].each { rn ->
        tasks.matching { it.name == rn }.configureEach { it.jvmArgs('-Dgt6.probes=true') }
    }
    logger.lifecycle("[gt6probes] оснастка проверки ВКЛЮЧЕНА: стенды + GameTest'ы (-Dgt6.probes=true)")
}

// PRODUCTION-JAR: та же JPMS split-package беда, что в run*/test, но БЕЗ фикса ⇒ ломала запуск в реальном
// (модульном) лаунчере. compat-mirror компилирует crutch-классы в net.minecraft.*/cpw.* — пакеты, которыми
// в рантайме ВЛАДЕЮТ реальные модули (minecraft / FML). Когда они попадают в jar, automatic-module gregtech6
// «экспортирует» net.minecraft.client.renderer ⇒ split с модулем minecraft ⇒ FML ResolutionException при
// загрузке мода (см. STATE.md ит.10). stripCompatMirror чистит их для dev-запусков и тестов, а `jar` от него не
// зависел ⇒ костыль недетерминированно (в зависимости от порядка задач) попадал в production-jar.
// Мираж по замыслу compileOnly («Аналог compileOnly dev-jar'ов оракула», см. §F10 выше) ⇒ его классы НЕ
// должны быть в jar. Исключаем ровно тот набор, что стрипается для run/test (проверен десятками runClient с
// полным рендером): net/minecraft (владеет модуль minecraft) + cpw (владеет FML). net/minecraftforge и прочие
// mod-API-миражи (appeng/ic2/…) НЕ трогаем — ими в чистой сборке НИКАКОЙ модуль не владеет (безвредны), а
// рантайм GT6 их shim'ы может звать (напр. IFluidBlock в CoverDrain); их снятие — задача F10 при реальной
// интеграции конкретного мода, не здесь. Исключение на УРОВНЕ jar (не delete из build/classes) ⇒ не мутирует
// общий вывод, не воюет с incremental и run-задачами.
tasks.named('jar').configure {
    exclude 'net/minecraft/**'
    exclude 'cpw/**'
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.

    // JEI (mezz.jei) — просмотрщик рецептов/предметов для визуальной приёмки. Репозиторий выверен по AE2.
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }

    // Jade (тултип «на что смотрю») — нужен ТОЛЬКО для компиляции плагина совместимости
    // (gregtech/compat/Compat_Jade.java): у GT6 свои инструменты добычи (гаечный ключ/лом/кусачки/…),
    // и Jade умеет принимать их через HarvestToolProvider.registerHandler — но для этого надо
    // реализовать его интерфейс ToolHandler, то есть иметь API на compile-classpath.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // Авто-вход в существующий мир для приёмочного render-probe (гейт ②): в меню DataComponents предметов НЕ bound
            // (ItemStack NPE «Components not bound yet»), а на world-load — bound. quickPlay грузит мир при старте →
            // level!=null → GT_API_Proxy_Client.onClientTickProbe вызывает GT6ItemModel.probeItemIcons (found/missing в gregtech.log).
            // ОТКЛЮЧЕНО: обычный запуск в главное меню. Авто-вход в мир — через клиент-хук onAutoWorldCreate (гейт wgautoworld.flag),
            // который на TitleScreen сам создаёт свежий CREATIVE-мир (createFreshLevel, минуя диалоги). quickPlay НЕ годится (виснет на диалоге).
            // programArguments.addAll '--quickPlaySingleplayer', 'GT6WGTest'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Риг «дедикейт + удалённый клиент» (BUG-094): серверу СВОЙ каталог — одновременный runClient
            // в общем run/ дерётся за logs/latest.log и gregtech.log (Windows file-lock), судья читает кашу.
            gameDirectory = project.file('runserver')
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Свой каталог: без него прогон сыпал logs/, config/ и .cache/ прямо в корень репозитория,
            // и этот мусор попадал под руку при коммите. Оснастка не гадит там, где лежат исходники.
            gameDirectory = project.file('rungametest')
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            // F-datagen: mod_id (gregtech6) — контейнер БЕЗ @Mod-класса; GatherDataEvent шлётся только на мод-шины из набора --mod,
            // а датапак-провайдер (энчанты/ворлдген) подписан на шине gregapi (GT6WorldgenFeature.register из GT_API-конструктора).
            // → --mod gregapi, иначе событие не доходит до хендлера и провайдеры не запускаются (0 ms / пустой src/generated).
            programArguments.addAll '--mod', 'gregapi', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Юнит-тесты ModDevGradle: настраивает sourceSet 'test' с Minecraft на classpath.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI (аналог NEI) — инструмент визуальной приёмки. Координаты выверены по AE2, метаданные резолвятся.
    // compileOnly-строки временно закомментированы: скачивание jar с maven.blamejared.com в этой среде
    // отваливается по таймауту, а на compileClasspath они БЛОКИРУЮТ компиляцию ядра (которое JEI пока не
    // импортирует — плагинов ещё нет). Раскомментировать при написании JEI-плагинов GregTech6 / когда сеть
    // до blamejared будет стабильна. localRuntime оставлен (он на runtime-пути, компиляцию не трогает;
    // подтянет полный JEI при запуске игры для приёмки визуала).
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${jei_minecraft_version}-neoforge:${jei_version}"

    // Jade — ТОЛЬКО compileOnly: плагин совместимости (gregtech/compat/Compat_Jade.java) реализует его
    // интерфейс ToolHandler, чтобы показывать НАСТОЯЩИЕ инструменты GT6 (гаечный ключ на машинах, лом, кусачки),
    // которых ванильными тегами выразить нельзя. В jar игрока Jade не тянется; без Jade класс плагина просто
    // не загружается (Jade сам ищет @WailaPlugin), поэтому production-код на него НЕ ссылается.
    compileOnly "maven.modrinth:jade:${jade_version}"
    // localRuntime — чтобы стенд gt6jadeprobe мог спросить РЕАЛЬНЫЙ Jade тем же вызовом, каким он рисует
    // тултип (HarvestToolProvider.getTool). На jar игрока не влияет: localRuntime — только dev-запуски.
    localRuntime "maven.modrinth:jade:${jade_version}"

    // JourneyMap (MODCOMPAT-002) — ТОЛЬКО для стенда gt6jmprobe: судья спрашивает РЕАЛЬНЫЙ JourneyMap тем же
    // каналом, каким тот решает судьбу блока на карте (BlockMD.get → isIgnore/getTextureColor/getAlpha;
    // декомпил-референс: journeymap-decompiled/). Production-код на него НЕ ссылается; исходники мода закрыты
    // (ARR), поэтому compileOnly идёт с того же Modrinth-maven, что и Jade.
    compileOnly "maven.modrinth:journeymap:${journeymap_version}"
    localRuntime "maven.modrinth:journeymap:${journeymap_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // --- Тестовый инструментарий (в MDK-шаблоне отсутствует; добавлено под gregtech6-neo) ---
    // JUnit 5 — headless-юнит-тесты чистой логики (./gradlew test).
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // NeoForge test framework — юнит-тесты в контексте MC-сервера (headless-реестры),
    // класс помечается @ExtendWith(EphemeralTestServerProvider.class).
    testImplementation "net.neoforged:testframework:${neo_version}"
}

// ДВА РЕЖИМА ПРОЕКТА — разделены намеренно (см. README «Development tooling»).
//
//   ПРОДУКТ (по умолчанию): `gradlew build` / `gradlew test` — проверки мода САМОГО ПО СЕБЕ.
//     Ничего сверх репозитория не требуют, работают у любого, кто склонировал, и служат гейтом CI.
//
//   ОСНАСТКА ФАЗЫ ПОРТА (только по требованию): сверка с оригиналом (`test -Pgt6.oracle=<путь>`) и живые
//     стенды (`-Pgt6probes`). Отвечают на вопрос «совпадает ли с оригиналом», для чего нужны дампы
//     живого 1.7.10 (~200 МБ, в репозиторий не входят). Этап порта закрыт: вопрос задаётся при
//     расследовании расхождения, а не на каждый прогон.
//
// Инструменты фазы НЕ выбрасываются и НЕ уходят в поставку — они переведены в режим по требованию.
// Паритет включается НАЛИЧИЕМ пути к дампам оригинала — отдельной задачи не заводим: окружение
// тестов Minecraft настраивает плагин сборки только для штатной `test`, самодельная Test-задача его
// не наследует и не стартует вовсе (проверено). Один механизм вместо двух:
//     gradlew test                         -> проверки мода самого по себе (эталон не нужен)
//     gradlew test -Pgt6.oracle=<путь>     -> плюс сверка с дампами живого 1.7.10
def oraclePath = project.findProperty('gt6.oracle')
test {
    useJUnitPlatform {
        if (!oraclePath) excludeTags 'parity'
    }
    if (oraclePath) systemProperty 'gt6.oracle', oraclePath.toString()
    // Тесты поднимают ВЕСЬ мод (тысячи предметов и рецептов). На дефолтном heap процесс падает
    // OutOfMemoryError уже во время загрузки, и тогда краснеют все проверки разом — не потому, что
    // код неверен, а потому, что мод не догрузился.
    maxHeapSize = '6G'
    doFirst {
        logger.lifecycle(oraclePath
            ? "[test] режим сверки с оригиналом: дампы ${oraclePath}"
            : "[test] продуктовый режим: проверки мода самого по себе (сверка с оригиналом — test -Pgt6.oracle=<путь>)")
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs << '-Xmaxerrs' << '100000' // ВРЕМЕННО (порт ядра): снять потолок в 100 ошибок, чтобы видеть хвост по всем швам
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Печать compileClasspath main — для случаев, когда нужно собрать подмножество исходников
// отдельным вызовом компилятора, минуя Gradle (диагностика швов).
tasks.register('printCompileCp') {
    def cp = sourceSets.main.compileClasspath
    doLast {
        println "COMPILE_CP_START"
        println cp.asPath
        println "COMPILE_CP_END"
    }
}
