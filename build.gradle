plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    // Шаблон считается ОТ КОРНЯ ресурсного каталога, а не от корня проекта, поэтому прежний
    // "src/generated/**/.cache" не срабатывал: кэш датагена уезжал в jar (найдено сверкой артефакта
    // из чистого клона с локальным — у постороннего jar оказался чище на 4 записи).
    exclude("**/.cache/**")
    // ИСПОЛНЯЕМЫЕ СКРИПТЫ В ДЕРЕВЕ АССЕТОВ. Оригинал GT6 хранит РЯДОМ с текстурами личную оснастку
    // художника: перетащил PNG на copy_into_dull.bat — тот раскопировал иконку по подпапкам
    // DULL/FINE/FLINT/… (12 таких файлов в textures/{blocks,items}/materialicons и .../randomtools).
    // Мод их не читает НИКОГДА — это инструмент подготовки ассетов, а не ресурс. В исходниках они
    // остаются (репозиторий — зеркало оригинала 1:1), но в поставку не идут: площадки раздачи модов
    // отклоняют архив с исполняемыми расширениями целиком, и весь jar становится непубликуемым.
    // Отсекается КЛАСС расширений, а не сегодняшние двенадцать файлов: любой новый скрипт, который
    // приедет с ассетами оригинала, отсеется молча и заранее.
    exclude("**/*.bat", "**/*.cmd", "**/*.com", "**/*.exe", "**/*.msi", "**/*.scr",
            "**/*.vbs", "**/*.ps1", "**/*.sh", "**/*.bin", "**/*.dll", "**/*.so")
}

// F10 (decisions/F10-external-mod-compat.md §3.2): ЦЕНТРАЛЬНОЕ ЗЕРКАЛО чужих API — единственная точка,
// где живут compile-only декларации интерфейсов внешних модов (IC2/AE2/…), которые GregTech6 реализует.
// Держит ядро компилируемым, пока интеграция с модами ОТЛОЖЕНА. Возврат к реальной интеграции = удалить
// этот каталог и подключить настоящие зависимости — в ОДНОМ месте. Аналог compileOnly dev-jar'ов оракула.
sourceSets.main.java.srcDir('src/compat-mirror/java')

// Режим -PcoreOnly СНЯТ вместе с фазой массовой компиляции, которую он обслуживал: он сужал сборку до
// ядра по двум спискам файлов, потому что контент-слой тогда ещё не компилировался. Контент собирается,
// фаза закрыта — режим и его списки (core_unit_v2_files.txt, mirror_files.txt) убраны из репозитория.

// Режим -PparityFull СНЯТ: он был третьим способом сказать «сверить с оригиналом» и после разделения
// режимов (см. блок test ниже) только путал. Сверка включается наличием пути к дампам оригинала:
//     gradlew test -Pgt6.oracle=<путь>

// runClient/runData/runServer (module-режим дев-запуска): те же JPMS split-package crutch-классы
// (net.minecraft.*/cpw.* из compat-mirror, зона F10), что и в test, конфликтуют с модулями minecraft/jei при
// module-resolution (ResolutionException «Modules minecraft and gregtech6 export package net.minecraft.*»).
// Стрипаем их из рантайм-вывода build/classes/java/main ПОСЛЕ compile, ДО запуска — ровно как stripMcMirror
// для test. Рантайм GT6 их не зовёт: render-shim'ы (IIcon/IIconRegister/RenderBlocks) superseded пайплайном
// GT6BlockModel (baked-модели), server-путь доказан parity-тестом. Если рантайм всё же дёрнет конкретный
// класс → точечный NoClassDefFound укажет его, тогда адаптируем адресно. incremental=false: strip удаляет
// .class из вывода, инкрементальная компиляция на след. прогоне путается («package does not exist») —
// полная компиляция регенерит миражи каждый раз, strip снова удаляет → консистентно.
tasks.named('compileJava').configure { options.incremental = false }
// ОДНА задача на весь проект: и дев-запуски, и тесты снимают одни и те же crutch-классы из одного и
// того же вывода. Прежде копий было две (для run* и для test) — и они разошлись: тестовая умела
// configuration cache, запусковая нет, из-за чего любой дев-запуск падал на кэше конфигурации.
// Пути вычисляются НА КОНФИГУРАЦИИ: обращение к file()/project внутри doLast несовместимо с кэшем.
def mirrorDirs = ['net/minecraft', 'cpw'].collect { file("build/classes/java/main/$it") }
def stripCompatMirror = tasks.register('stripCompatMirror') {
    description = 'Снять compile-only зеркала (net.minecraft, cpw) из рантайм-вывода: их пакетами владеет движок'
    doLast {
        int removed = 0
        mirrorDirs.each { d ->
            if (d.exists()) {
                d.eachFileRecurse { if (it.isFile()) removed++ }
                d.deleteDir()
            }
        }
        println("[strip] снято ${removed} crutch-.class из рантайм-модуля")
    }
}
stripCompatMirror.configure { mustRunAfter tasks.named('classes') }
['runClient', 'runData', 'runServer', 'runGameTestServer'].each { rn ->
    tasks.matching { it.name == rn }.configureEach { dependsOn stripCompatMirror }
}
tasks.named('test').configure { dependsOn stripCompatMirror }

// РУБИЛЬНИК отладочных проб (CS.probeFlag): файлы-флаги в run/ работают ТОЛЬКО при запуске с -Pgt6probes
// (запуски оркестратора: `gradlew runClient -Pgt6probes …`). Обычный запуск игрока — пробы/автовход-в-мир
// мертвы, даже если флаг случайно остался (класс сбоя «стухший флаг портит игровой запуск» закрыт механически).
if (project.hasProperty('gt6probes')) {
    // ОСНАСТКА ПРОВЕРКИ ЖИВЁТ ВНЕ РЕПОЗИТОРИЯ (решение владельца 2026-08-12: в репозитории только
    // продукт). Каталоги `src/probes` и `src/gametest` удалены из этой ветки 2026-08-12: там лежал
    // снимок стендов под neo-API 26.1.2, унесённый при отпочковании ветки, — 17 из 18 файлов
    // побайтово совпадали с версией main перед выносом. Под Forge 1.20.1 инструментарий ещё только
    // предстоит построить; история снимка — в коммите 3f76fc66^ на main.
    //
    // Свой каталог, а НЕ общий ../stands: там оснастка под 26.1.2, её код не собирается на 1.20.1.
    // Нет каталога — гейт просто ничего не подключает, сборка продукта этим не задета.
    file('../stands-1.20.1').listFiles()?.each { d ->
        if (new File(d, 'java').isDirectory()) sourceSets.main.java.srcDir("${d}/java")
    }
    ['runClient', 'runData', 'runServer', 'runGameTestServer'].each { rn ->
        tasks.matching { it.name == rn }.configureEach { it.jvmArgs('-Dgt6.probes=true')
            // проброс параметров стендов (напр. -Pgt6.probeArgs=gt6.drainprobe.kind=1)
            if (project.hasProperty('gt6.probeArgs')) project.property('gt6.probeArgs').toString().split(',').each { a -> it.jvmArgs('-D' + a) } }
    }
    logger.lifecycle("[gt6probes] оснастка проверки ВКЛЮЧЕНА: стенды + GameTest'ы (-Dgt6.probes=true)")
}

// PRODUCTION-JAR: та же JPMS split-package беда, что в run*/test, но БЕЗ фикса ⇒ ломала запуск в реальном
// (модульном) лаунчере. compat-mirror компилирует crutch-классы в net.minecraft.*/cpw.* — пакеты, которыми
// в рантайме ВЛАДЕЮТ реальные модули (minecraft / FML). Когда они попадают в jar, automatic-module gregtech6
// «экспортирует» net.minecraft.client.renderer ⇒ split с модулем minecraft ⇒ FML ResolutionException при
// загрузке мода (см. STATE.md ит.10). stripCompatMirror чистит их для dev-запусков и тестов, а `jar` от него не
// зависел ⇒ костыль недетерминированно (в зависимости от порядка задач) попадал в production-jar.
// Мираж по замыслу compileOnly («Аналог compileOnly dev-jar'ов оракула», см. §F10 выше) ⇒ его классы НЕ
// должны быть в jar. Исключаем ровно тот набор, что стрипается для run/test (проверен десятками runClient с
// полным рендером): net/minecraft (владеет модуль minecraft) + cpw (владеет FML). net/minecraftforge и прочие
// mod-API-миражи (appeng/ic2/…) НЕ трогаем — ими в чистой сборке НИКАКОЙ модуль не владеет (безвредны), а
// рантайм GT6 их shim'ы может звать (напр. IFluidBlock в CoverDrain); их снятие — задача F10 при реальной
// интеграции конкретного мода, не здесь. Исключение на УРОВНЕ jar (не delete из build/classes) ⇒ не мутирует
// общий вывод, не воюет с incremental и run-задачами.
tasks.named('jar').configure {
    exclude 'net/minecraft/**'
    exclude 'cpw/**'
    // КАНАЛ МИКСИН-КОНФИГА НА ЭТОЙ ВЕТКЕ. Forge 1.20.1 (47.4.22) НЕ читает секцию [[mixins]] из mods.toml —
    // это канал neo (там он и работает, ветка main). Реальный канал версии — атрибут манифеста MixinConfigs;
    // проверено на живом рантайме этой же сборки: Jade регистрируется именно им
    // (jade-11.13.3+forge.jar, META-INF/MANIFEST.MF: "MixinConfigs: jade.mixins.json"), а наш конфиг при
    // [[mixins]]-объявлении в логе не появлялся ВООБЩЕ (ни "Registering mixin config", ни "Selecting config").
    // DEV-запуск манифеста не имеет вовсе (мод подаётся каталогами классов/ресурсов), поэтому там канал
    // другой — блок `mixin { config ... }` ниже: плагин сборки кладёт `--mixin.config=` в аргументы запуска.
    manifest { attributes(['MixinConfigs': 'gregapi.mixins.json']) }
}

// КАНАЛ МИКСИН-КОНФИГА В DEV-ЗАПУСКАХ. Штатный DSL плагина legacyforge
// (net.neoforged.moddevgradle.legacyforge.dsl.MixinExtension: `config(String)`), который добавляет
// `--mixin.config=<имя>` в аргументы каждого runClient/runServer — строка `--mixin.config` лежит прямо
// в LegacyForgeModDevPlugin.class. Замер: ДО этой строки в debug.log не было ни одной записи
// «Registering mixin config: gregapi.mixins.json», хотя [[mixins]] в mods.toml был объявлен, а копия
// атрибута MixinConfigs в src/main/resources/META-INF/MANIFEST.MF на dev-раскладке не читается.
mixin {
    config 'gregapi.mixins.json'
    // REFMAP для PRODUCTION-jar. В dev рантайм на mojmap-именах и refmap не нужен, но в jar игрока
    // Forge 1.20.1 живёт на SRG — без карты имён инжект `setSectionDirty(IIIZ)V` там не найдёт цель.
    // `add(sourceSet, имя)` — штатный метод того же MixinExtension: он подключает annotation-processor
    // миксина (-AoutRefMapFile/-AoutTsrgFile/-AmappingTypes=tsrg — строки в MixinCompilerArgs.class)
    // и кладёт готовую карту в jar. Ветка main этого не требует: там рантайм и jar на одних именах.
    add(sourceSets.main, 'gregapi.refmap.json')
}

// ВЫХОД ОБРАБОТЧИКА МИКСИНА — ЧАСТЬ РЕЗУЛЬТАТА КОМПИЛЯЦИИ. Обработчик кладёт refmap и карту имён в
// `build/mixin`, но Gradle об этом каталоге не знает: он не объявлен выходом `compileJava`. Пока задача
// выполняется — всё на месте; как только она берётся из кеша (`:compileJava FROM-CACHE`, наблюдалось на
// `clean build`), каталог не восстанавливается, и `:reobfJar` падает на отсутствующем `.mappings.tsrg`
// (BP-BUG-006, вторичный дефект). Объявление каталога выходом чинит обе стороны: кеш его сохраняет и
// восстанавливает вместе с классами.
tasks.named('compileJava') {
    outputs.dir(layout.buildDirectory.dir('mixin')).withPropertyName('mixinRefmapDir')
}

// ВОСПРОИЗВОДИМАЯ СБОРКА. По умолчанию zip-записи несут время создания файла и порядок обхода
// файловой системы — из-за этого два прогона ОДНОГО коммита дают разный jar и разную контрольную
// сумму (наблюдалось: локальная сборка и сборка CI из одного тега отличались размером). Тогда
// контрольная сумма доказывает только «файл дошёл целым», но не «собран из этого исходника».
// С этими тремя настройками любой желающий пересобирает тег и получает ПОБАЙТОВО тот же jar —
// проверка, которая не требует доверия ни к автору, ни к площадке.
//   preserveFileTimestamps=false — время записей фиксируется константой вместо «сейчас»;
//   reproducibleFileOrder=true   — порядок записей сортируется вместо порядка обхода ФС;
//   *Permissions                 — права не зависят от umask сборочной машины (Windows/Linux).
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    dirPermissions { unix(0755) }
    filePermissions { unix(0644) }
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.

    // JEI (mezz.jei) — просмотрщик рецептов/предметов для визуальной приёмки. Репозиторий выверен по AE2.
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }

    // Jade (тултип «на что смотрю») — нужен ТОЛЬКО для компиляции плагина совместимости
    // (gregtech/compat/Compat_Jade.java): у GT6 свои инструменты добычи (гаечный ключ/лом/кусачки/…),
    // и Jade умеет принимать их через HarvestToolProvider.registerHandler — но для этого надо
    // реализовать его интерфейс ToolHandler, то есть иметь API на compile-classpath.
    maven {
        url = 'https://api.modrinth.com/maven'
        content { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)   // Forge 1.20.1 = Java 17

legacyForge {
    // NeoForge 1.20.1 — целевой загрузчик проекта. Линейка 47.1.x — форк Forge 47.1.3, живёт на тех же
    // пакетах net.minecraftforge и том же META-INF/mods.toml (разъезд имён начался с 1.20.2+),
    // поэтому весь код ветки против API 1.20.1 остаётся валидным.
    // Шорткат `version = ...` у этого расширения означает ИМЕННО MinecraftForge
    // (LegacyForgeExtension.setVersion → LegacyForgeModdingSettings.forgeVersion); NeoForge задаётся
    // только через enable{} (LegacyForgeModdingSettings.setNeoForgeVersion) — проверено javap по jar плагина.
    enable {
        neoForgeVersion = project.neoforge_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // Авто-вход в существующий мир для приёмочного render-probe (гейт ②): в меню DataComponents предметов НЕ bound
            // (ItemStack NPE «Components not bound yet»), а на world-load — bound. quickPlay грузит мир при старте →
            // level!=null → GT_API_Proxy_Client.onClientTickProbe вызывает GT6ItemModel.probeItemIcons (found/missing в gregtech.log).
            // ОТКЛЮЧЕНО: обычный запуск в главное меню. Автовход в мир — НЕ здесь: он живёт в оснастке
            // стендов (stands-1.20.1/_core/java/gregapi/GT6ProbeKitClient.java, подключается при -Pgt6probes)
            // и управляется файлами в run/: wgautoworld.flag = свежий мир, wgautoworld.world = имя существующего.
            // Второго носителя того же приёма здесь не заводим.
            // programArguments.addAll '--quickPlaySingleplayer', 'GT6WGTest'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Риг «дедикейт + удалённый клиент» (BUG-094): серверу СВОЙ каталог — одновременный runClient
            // в общем run/ дерётся за logs/latest.log и gregtech.log (Windows file-lock), судья читает кашу.
            gameDirectory = project.file('runserver')
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Свой каталог: без него прогон сыпал logs/, config/ и .cache/ прямо в корень репозитория,
            // и этот мусор попадал под руку при коммите. Оснастка не гадит там, где лежат исходники.
            gameDirectory = project.file('rungametest')
        }

        data {
            data() // 1.20.1: тип запуска датагена — 'data' (clientData — деление 26.x; доступные типы: client, data, gameTestServer, server)

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            // F-datagen: mod_id (gregtech6) — контейнер БЕЗ @Mod-класса; GatherDataEvent шлётся только на мод-шины из набора --mod,
            // а датапак-провайдер (энчанты/ворлдген) подписан на шине gregapi (GT6WorldgenFeature.register из GT_API-конструктора).
            // → --mod gregapi, иначе событие не доходит до хендлера и провайдеры не запускаются (0 ms / пустой src/generated).
            programArguments.addAll '--mod', 'gregapi', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // [1.20.1 замер] unitTest{} у legacyForge-расширения нет — блок снят: цель прогона компиляция ядра.
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// РЕМАППИНГ ЧУЖИХ МОДОВ ДЛЯ DEV-РАНТАЙМА (boot-ступень 6). Production-jar'ы модов (Jade, JEI)
// зовут движок SRG-именами (m_XXXXX_), а dev-рантайм этой сборки — named (official): без ремапа
// первый же вызов даёт NoSuchMethodError (пойман живьём: Jade WailaConfig → StringRepresentable).
// Механизм — штатный у плагина legacyforge (ModDevGradle LEGACY.md §Remapping Mod Dependencies,
// строки 70-91): createRemappingConfiguration(localRuntime) создаёт конфигурацию modLocalRuntime,
// зависимости которой ремапятся SRG→official и попадают в localRuntime. ⚠️ mod-конфигурации
// НЕтранзитивны (там же) — транзитивные зависимости модов при нужде добавлять руками.
obfuscation.createRemappingConfiguration(configurations.localRuntime)

dependencies {
    // ПРОЦЕССОР МИКСИНА ДЛЯ PRODUCTION-СБОРКИ (BP-BUG-006, смок 2026-08-15).
    // Блок `mixin { add(...) }` ниже задаёт JavaCompile только АРГУМЕНТЫ обработчика
    // (`-AdefaultObfuscationEnv=searge`, `-AmappingTypes=tsrg`, `-ApluginVersion=0.7` + пути refmap/tsrg —
    // проверено дизассемблером `MixinExtension.add`/`MixinCompilerArgs` из moddev-gradle 2.0.141), но САМ
    // обработчик в конфигурацию `annotationProcessor` не кладёт: это разделение штатное — плагин отвечает за
    // аргументы, сборка за процессор. Без этой строки `annotationProcessor` пуст, карта имён не рождается и
    // `:reobfJar` падает `FileNotFoundException: build/mixin/gregapi.refmap.json.mappings.tsrg` — боевой jar
    // собрать нельзя. Артефакт тот же, что уже лежит на compile-пути (несёт
    // `META-INF/services/javax.annotation.processing.Processor` + `MixinObfuscationProcessor`), новой
    // зависимости в сборку не вводится.
    annotationProcessor 'org.spongepowered:mixin:0.8.5'
    // Транзитивные зависимости САМОГО обработчика: POM mixin-0.8.5 их не объявляет (jar собран
    // shaded для рантайма), а на processor-path Gradle кладёт ровно то, что перечислено. Без них
    // обработчик стартует и падает `NoClassDefFoundError: com/google/gson/JsonParseException`
    // (замер 2026-08-15). Версии — те же, что уже в сборке 1.20.1, новых в среду не вводится.
    annotationProcessor 'com.google.code.gson:gson:2.10.1'
    annotationProcessor 'com.google.guava:guava:31.1-jre'
    annotationProcessor 'org.ow2.asm:asm:9.9.1'
    annotationProcessor 'org.ow2.asm:asm-tree:9.9.1'
    annotationProcessor 'org.ow2.asm:asm-commons:9.9.1'
    annotationProcessor 'org.ow2.asm:asm-util:9.9.1'
    annotationProcessor 'org.ow2.asm:asm-analysis:9.9.1'
    annotationProcessor 'commons-io:commons-io:2.20.0'

    // JEI (аналог NEI) — инструмент визуальной приёмки. Координаты выверены по AE2, метаданные резолвятся.
    // compileOnly-строки временно закомментированы: скачивание jar с maven.blamejared.com в этой среде
    // отваливается по таймауту, а на compileClasspath они БЛОКИРУЮТ компиляцию ядра (которое JEI пока не
    // импортирует — плагинов ещё нет). Раскомментировать при написании JEI-плагинов GregTech6 / когда сеть
    // до blamejared будет стабильна. localRuntime оставлен (он на runtime-пути, компиляцию не трогает;
    // подтянет полный JEI при запуске игры для приёмки визуала).
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${jei_minecraft_version}-forge-api:${jei_version}"
    modLocalRuntime "mezz.jei:jei-${jei_minecraft_version}-forge:${jei_version}"

    // Jade — ТОЛЬКО compileOnly: плагин совместимости (gregtech/compat/Compat_Jade.java) реализует его
    // интерфейс ToolHandler, чтобы показывать НАСТОЯЩИЕ инструменты GT6 (гаечный ключ на машинах, лом, кусачки),
    // которых ванильными тегами выразить нельзя. В jar игрока Jade не тянется; без Jade класс плагина просто
    // не загружается (Jade сам ищет @WailaPlugin), поэтому production-код на него НЕ ссылается.
    // Версия под 1.20.1 подобрана из исходников контракта (reference/mods/Jade-src-1.20.1,
    // ветка 1.20-forge, gradle.properties: 11.13.3 / MC 1.20.1) — не с потолка.
    compileOnly "maven.modrinth:jade:${jade_version}"
    // modLocalRuntime (ремап SRG→named, см. блок obfuscation выше) — чтобы стенд gt6jadeprobe мог
    // спросить РЕАЛЬНЫЙ Jade тем же вызовом, каким он рисует тултип (HarvestToolProvider.getTool).
    // На jar игрока не влияет: попадает только в localRuntime = dev-запуски.
    modLocalRuntime "maven.modrinth:jade:${jade_version}"

    // JourneyMap (MODCOMPAT-002) — ТОЛЬКО для стенда gt6jmprobe: судья спрашивает РЕАЛЬНЫЙ JourneyMap тем же
    // каналом, каким тот решает судьбу блока на карте (BlockMD.get → isIgnore/getTextureColor/getAlpha;
    // декомпил-референс: journeymap-decompiled/). Production-код на него НЕ ссылается; исходники мода закрыты
    // (ARR), поэтому compileOnly идёт с того же Modrinth-maven, что и Jade.
    // [1.20.1 замер] compileOnly снят: версия под 1.20.1 не подобрана
    // [1.20.1 замер] localRuntime снят: версия под 1.20.1 не подобрана

    // Applied Energistics 2 (слой совместимости GT6 ⇄ AE2, этап Э0). GT6 знает AE2 с 1.7.10:
    // gregtech/compat/Compat_Recipes_AppliedEnergistics.java задаёт прессы, резку, sky stone; MD.AE.mLoaded
    // сторожит все эти пути. Тот же приём, что у Jade выше — Modrinth-maven, compileOnly + modLocalRuntime.
    // ⚠ ПАКЕТ appeng.* ТЕПЕРЬ ПРИНАДЛЕЖИТ ЭТОМУ JAR. Зеркала src/compat-mirror/java/appeng/ удалены (Э0):
    // один пакет обязан принадлежать ровно одному источнику классов, иначе второй молча затирается и
    // порядок обхода недетерминирован. Новые зеркала в appeng.* класть НЕЛЬЗЯ: код должен ходить в
    // настоящий API AE2.
    compileOnly "maven.modrinth:ae2:${ae2_version}"
    // modLocalRuntime, а не localRuntime: production-jar AE2 зовёт движок SRG-именами, dev-рантайм этой
    // сборки — named (см. блок obfuscation выше). Без ремапа первый же вызов даст NoSuchMethodError.
    modLocalRuntime "maven.modrinth:ae2:${ae2_version}"
    // GuideME — обязательная зависимость AE2 (её mods.toml: modId="guideme", mandatory=true); без неё
    // загрузчик AE2 не поднимет. Только рантайм: наш код её не трогает.
    modLocalRuntime "maven.modrinth:guideme:${guideme_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // --- Тестовый инструментарий (в MDK-шаблоне отсутствует; добавлено под gregtech6-neo) ---
    // JUnit 5 — headless-юнит-тесты чистой логики (./gradlew test).
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // [1.20.1 замер] testframework NeoForge под 1.20.1 не существует — снят: цель прогона компиляция ядра.
}

// ДВА РЕЖИМА ПРОЕКТА — разделены намеренно (см. README «Development tooling»).
//
//   ПРОДУКТ (по умолчанию): `gradlew build` / `gradlew test` — проверки мода САМОГО ПО СЕБЕ.
//     Ничего сверх репозитория не требуют, работают у любого, кто склонировал, и служат гейтом CI.
//
//   ОСНАСТКА ФАЗЫ ПОРТА (только по требованию): сверка с оригиналом (`test -Pgt6.oracle=<путь>`) и живые
//     стенды (`-Pgt6probes`). Отвечают на вопрос «совпадает ли с оригиналом», для чего нужны дампы
//     живого 1.7.10 (~200 МБ, в репозиторий не входят). Этап порта закрыт: вопрос задаётся при
//     расследовании расхождения, а не на каждый прогон.
//
// Инструменты фазы НЕ выбрасываются и НЕ уходят в поставку — они переведены в режим по требованию.
// Паритет включается НАЛИЧИЕМ пути к дампам оригинала — отдельной задачи не заводим: окружение
// тестов Minecraft настраивает плагин сборки только для штатной `test`, самодельная Test-задача его
// не наследует и не стартует вовсе (проверено). Один механизм вместо двух:
//     gradlew test                         -> проверки мода самого по себе (эталон не нужен)
//     gradlew test -Pgt6.oracle=<путь>     -> плюс сверка с дампами живого 1.7.10
//
// ⚠️ В ЭТОЙ ВЕТКЕ ТЕСТОВ ПОКА НЕТ. `src/test` удалён 2026-08-12 вместе со снимком оснастки 26.1.2;
// набор под Forge 1.20.1 предстоит построить. Код тестов подключается снаружи, как на main:
// ../stands-1.20.1/*/test-java. Нет каталога — `gradlew test` просто ничего не находит.
file('../stands-1.20.1').listFiles()?.each { d ->
    if (new File(d, 'test-java').isDirectory()) sourceSets.test.java.srcDir("${d}/test-java")
}

def oraclePath = project.findProperty('gt6.oracle')
test {
    useJUnitPlatform {
        if (!oraclePath) excludeTags 'parity'
    }
    if (oraclePath) systemProperty 'gt6.oracle', oraclePath.toString()
    // Тесты поднимают ВЕСЬ мод (тысячи предметов и рецептов). На дефолтном heap процесс падает
    // OutOfMemoryError уже во время загрузки, и тогда краснеют все проверки разом — не потому, что
    // код неверен, а потому, что мод не догрузился.
    maxHeapSize = '6G'
    doFirst {
        logger.lifecycle(oraclePath
            ? "[test] режим сверки с оригиналом: дампы ${oraclePath}"
            : "[test] продуктовый режим: проверки мода самого по себе (сверка с оригиналом — test -Pgt6.oracle=<путь>)")
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            forge_version          : forge_version,
            neoforge_version_range : neoforge_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
legacyForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs << '-Xmaxerrs' << '100000' // ВРЕМЕННО (порт ядра): снять потолок в 100 ошибок, чтобы видеть хвост по всем швам
    // [1.20.1 замер] javac ОТДЕЛЬНЫМ процессом со своей памятью: при десятках тысяч ошибок компилятор
    // держит их все в куче и роняет сам демон Gradle (проверено: OutOfMemoryError в daemon-28324.out.log,
    // после чего прогон висит, не завершаясь). Форк отделяет память компилятора от памяти демона.
    options.fork = true
    options.forkOptions.memoryMaximumSize = '12g'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Печать compileClasspath main — для случаев, когда нужно собрать подмножество исходников
// отдельным вызовом компилятора, минуя Gradle (диагностика швов).
tasks.register('printCompileCp') {
    def cp = sourceSets.main.compileClasspath
    doLast {
        println "COMPILE_CP_START"
        println cp.asPath
        println "COMPILE_CP_END"
    }
}
