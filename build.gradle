plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    // The pattern is resolved from the resource-tree ROOT, not the project root, so the old
    // "src/generated/**/.cache" never matched: the datagen cache leaked into the jar (found by
    // diffing a clean-clone artifact against the local one — the foreign jar was 4 entries cleaner).
    exclude("**/.cache/**")
    // EXECUTABLE SCRIPTS IN THE ASSET TREE. The GT6 original keeps the artist's personal tooling
    // RIGHT NEXT to the textures: drag a PNG onto copy_into_dull.bat and it fans the icon out across
    // the DULL/FINE/FLINT/... subfolders (12 such files under textures/{blocks,items}/materialicons
    // and .../randomtools). The mod NEVER reads them — they're an asset-prep tool, not a resource.
    // They stay in the sources (the repo mirrors the original 1:1), but don't ship: mod-distribution
    // sites reject an archive carrying executable extensions outright, making the whole jar unpublishable.
    // The exclusion targets the CLASS of extensions, not today's twelve files: any new script that
    // arrives with the original's assets is filtered out silently and in advance.
    exclude("**/*.bat", "**/*.cmd", "**/*.com", "**/*.exe", "**/*.msi", "**/*.scr",
            "**/*.vbs", "**/*.ps1", "**/*.sh", "**/*.bin", "**/*.dll", "**/*.so")
}

// F10 (decisions/F10-external-mod-compat.md §3.2): CENTRAL MIRROR of foreign APIs — the single spot
// holding compile-only interface declarations for external mods (IC2/AE2/...) that GregTech6 implements.
// Keeps the core compiling while mod integration is DEFERRED. Returning to real integration means deleting
// this directory and wiring up the real dependencies — in ONE place. Analogous to the oracle's compileOnly dev-jars.
sourceSets.main.java.srcDir('src/compat-mirror/java')
// Mods present at runtime as real jars (JEI, Jade, AE2, Ex Machina) compile against stand-ins declared here.
// Those jars own the packages at runtime, so the set builds apart and never enters the mod's output or jar.
sourceSets { provided { java.srcDir('src/compat-mirror/provided') } }

// The -PcoreOnly mode was REMOVED together with the mass-compilation phase it served: it narrowed the
// build to the core via two file lists, because the content layer didn't compile yet back then. The
// content now compiles, the phase is closed — the mode and its lists (core_unit_v2_files.txt,
// mirror_files.txt) are removed from the repository.

// The -PparityFull mode was REMOVED: it was a third way to say "diff against the original" and, after
// the modes were split (see the test block below), only caused confusion. Parity is enabled by the
// presence of a path to the original's dumps:
//     gradlew test -Pgt6.oracle=<path>

// runClient/runData/runServer (dev-run module mode): the same JPMS split-package crutch classes
// (net.minecraft.*/cpw.* from compat-mirror, F10 zone) as in test conflict with the minecraft/jei modules
// during module resolution (ResolutionException "Modules minecraft and gregtech6 export package net.minecraft.*").
// Strip them from the build/classes/java/main runtime output AFTER compile, BEFORE launch — exactly like
// stripMcMirror does for test. GT6's runtime never calls them: the render shims (IIcon/IIconRegister/RenderBlocks)
// are superseded by the GT6BlockModel pipeline (baked models), and the server path is proven by the parity
// test. If the runtime ever does reach for a specific class, a pinpoint NoClassDefFound will name it and it
// gets adapted then. incremental=false: stripping removes .class files from the output, and incremental
// compilation on the next run gets confused ("package does not exist") — a full compile regenerates the
// mirages every time, strip removes them again → consistent.
tasks.named('compileJava').configure { options.incremental = false }
// ONE task for the whole project: both dev runs and tests strip the same crutch classes from the same
// output. There used to be two copies (for run* and for test) and they drifted apart — the test one
// supported the configuration cache, the run one didn't, so any dev run failed on the config cache.
// Paths are computed AT CONFIGURATION time: touching file()/project inside doLast is incompatible with the cache.
def mirrorDirs = ['net/minecraft', 'cpw'].collect { file("build/classes/java/main/$it") }
def stripCompatMirror = tasks.register('stripCompatMirror') {
    description = 'Strip compile-only mirrors (net.minecraft, cpw) from the runtime output: their packages belong to the engine'
    doLast {
        int removed = 0
        mirrorDirs.each { d ->
            if (d.exists()) {
                d.eachFileRecurse { if (it.isFile()) removed++ }
                d.deleteDir()
            }
        }
        println("[strip] removed ${removed} crutch .class files from the runtime module")
    }
}
stripCompatMirror.configure { mustRunAfter tasks.named('classes') }
['runClient', 'runData', 'runServer', 'runGameTestServer'].each { rn ->
    tasks.matching { it.name == rn }.configureEach { dependsOn stripCompatMirror }
}
tasks.named('test').configure { dependsOn stripCompatMirror }

// DEBUG-PROBE MASTER SWITCH (CS.probeFlag): flag files under run/ work ONLY when launched with -Pgt6probes
// (orchestrator runs: `gradlew runClient -Pgt6probes ...`). A regular player launch — probes/auto-world-join
// are dead even if a flag was accidentally left behind (the "stale flag corrupts a game launch" defect class
// is closed mechanically).
if (project.hasProperty('gt6probes')) {
    // TEST RIGS LIVE OUTSIDE THE REPOSITORY — entirely, no exceptions (owner decision 2026-08-11:
    // "stands will never live inside the repository again"). A stand is an instrument, not the product: it
    // never ships, never enters history or the jar, and is wired in only here, under -Pgt6probes.
    // It lives in the working environment next to the repo: ../stands/<lab>/java. If the directory is
    // missing (the repo was cloned on its own), the build proceeds without the rig — the product doesn't need it.
    // Stands are self-contained: they subscribe to events themselves (@EventBusSubscriber), and
    // production code doesn't know about them at all.
    file('../stands').listFiles()?.each { d ->
        File tSrc = new File(d, 'java')
        if (tSrc.isDirectory()) {
            sourceSets.main.java.srcDir(tSrc)
            logger.lifecycle("[gt6probes] external stand wired in: ${d.name}")
        }
    }
    ['runClient', 'runData', 'runServer', 'runGameTestServer'].each { rn ->
        tasks.matching { it.name == rn }.configureEach { it.jvmArgs('-Dgt6.probes=true')
            // forward stand parameters (e.g. -Pgt6.probeArgs=gt6.drainprobe.kind=1)
            if (project.hasProperty('gt6.probeArgs')) project.property('gt6.probeArgs').toString().split(',').each { a -> it.jvmArgs('-D' + a) } }
    }
    logger.lifecycle("[gt6probes] test rig ENABLED: external stands (-Dgt6.probes=true)")
}

// PRODUCTION JAR: the same JPMS split-package trouble as in run*/test, but WITHOUT the fix ⇒ it broke
// launches on a real (modular) launcher. compat-mirror compiles crutch classes into net.minecraft.*/cpw.* —
// packages OWNED at runtime by real modules (minecraft / FML). Once they land in the jar, the automatic
// module gregtech6 "exports" net.minecraft.client.renderer ⇒ split with the minecraft module ⇒ an FML
// ResolutionException on mod load (see STATE.md item 10). stripCompatMirror cleans them for dev runs and
// tests, but `jar` didn't depend on it ⇒ the crutch classes ended up in the production jar nondeterministically
// (depending on task order).
// A mirage is compileOnly by design ("analogous to the oracle's compileOnly dev-jars", see §F10 above)
// ⇒ its classes must NOT be in the jar. We exclude exactly the set that's stripped for run/test (verified
// with dozens of full-render runClient runs): net/minecraft (owned by the minecraft module) + cpw (owned by
// FML). net/minecraftforge and other mod-API mirages (appeng/ic2/...) are left ALONE — no module owns them
// in a clean build (harmless), and GT6's runtime may call their shims (e.g. IFluidBlock in CoverDrain);
// removing those is F10's job during real integration of that specific mod, not here. The exclusion happens
// at the jar LEVEL (not a delete from build/classes) ⇒ it doesn't mutate the shared output and doesn't fight
// with incremental compilation or the run tasks.
tasks.named('jar').configure {
    exclude 'net/minecraft/**'
    exclude 'cpw/**'
}

// REPRODUCIBLE BUILD. By default zip entries carry file-creation timestamps and filesystem-traversal
// order — so two runs of the SAME commit produce a different jar and a different checksum (observed:
// a local build and a CI build from the same tag differed in size). Then the checksum only proves "the
// file arrived intact," not "it was built from this source."
// With these three settings, anyone can rebuild the tag and get the BYTE-IDENTICAL jar — a check that
// requires trusting neither the author nor the hosting site.
//   preserveFileTimestamps=false — entry timestamps are pinned to a constant instead of "now";
//   reproducibleFileOrder=true   — entries are sorted instead of following filesystem-traversal order;
//   *Permissions                 — permissions don't depend on the build machine's umask (Windows/Linux).
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    dirPermissions { unix(0755) }
    filePermissions { unix(0644) }
}

repositories {
    // No mod repositories: the build downloads only the platform (Gradle, NeoForge, Minecraft, their libraries).
    // A foreign mod API compiles from src/compat-mirror/provided, a foreign mod jar comes from ../stands/_mods.
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // Auto-join an existing world for the acceptance render probe (gate ②): in the menu, item DataComponents
            // are NOT bound (ItemStack NPE "Components not bound yet"), but on world-load they are bound. quickPlay
            // loads the world at startup → level!=null → GT_API_Proxy_Client.onClientTickProbe calls
            // GT6ItemModel.probeItemIcons (found/missing logged to gregtech.log).
            // DISABLED: a regular launch goes to the main menu. Auto-join is done via the client hook onAutoWorldCreate
            // (gated by wgautoworld.flag), which on the TitleScreen creates a fresh CREATIVE world itself
            // (createFreshLevel, bypassing dialogs). quickPlay does NOT work (hangs on a dialog).
            // programArguments.addAll '--quickPlaySingleplayer', 'GT6WGTest'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // "Dedicated server + remote client" rig (BUG-094): the server gets its OWN directory — a concurrent
            // runClient sharing run/ fights over logs/latest.log and gregtech.log (Windows file lock), and the judge reads garbage.
            gameDirectory = project.file('runserver')
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Own directory: without it, the run dumped logs/, config/ and .cache/ straight into the repo
            // root, and that junk got caught up in commits. The rig doesn't litter where the sources live.
            gameDirectory = project.file('rungametest')
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            // F-datagen: mod_id (gregtech6) is a container WITHOUT an @Mod class; GatherDataEvent is only fired on the
            // mod buses listed in --mod, and the datapack provider (enchantments/worldgen) is subscribed on the gregapi
            // bus (GT6WorldgenFeature.register from the GT_API constructor).
            // → --mod gregapi, otherwise the event never reaches the handler and providers don't run (0 ms / empty src/generated).
            programArguments.addAll '--mod', 'gregapi', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // ModDevGradle unit tests: sets up the 'test' sourceSet with Minecraft on the classpath.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}
neoForge.addModdingDependenciesTo(sourceSets.provided)

// Local mode: NeoFormRuntime takes the game from the platform copy beside the repository instead of asking Mojang.
// Its manifests under minecraft/resolved point every address at a file of that copy.
if (gradle.platformCopy) {
    neoFormRuntime.launcherManifestUrl = new File(gradle.platformCopy, 'minecraft/resolved/launcher_manifest.json').toURI().toString()
    tasks.withType(net.neoforged.nfrtgradle.DownloadAssets).configureEach {
        doFirst {
            if (!System.getenv('NFRT_ASSET_REPOSITORY')) {
                throw new GradleException('Local mode starts through gradlew: it tells NeoFormRuntime where the game assets are.')
            }
        }
    }
}

// Foreign mods are never fetched: they sit beside the repository, and a bare clone builds and runs GregTech alone.
def localMods = file('../stands/_mods')
def devRunMods = [
    // JEI is the visual-acceptance viewer; Jade, JourneyMap, AE2, More Red and BuildCraft are what the compat stands query.
    "jei-${jei_minecraft_version}-neoforge-${jei_version}.jar",
    "jade-${jade_version}.jar",
    "journeymap-${journeymap_version}.jar",
    "ae2-${ae2_version}.jar",
    "guideme-${guideme_version}.jar",
    // Built from reference/mods/MoreRed-src, the source of the 26.1.2.3 release; it carries Ex Machina inside.
    "morered-${morered_version}.jar",
    // BuildCraft (Unofficial) owns the buildcraft.api packages GT6 integrates with.
    "BCunofficial-${buildcraft_version}.jar",
]
// Sodium lights quads by vertex index, so only under it does a vertex-order defect show; render acceptance only.
if (project.hasProperty('gt6probes')) devRunMods << 'sodium-neoforge-0.9.1-mc26.1.2.jar'
def probeCompileMods = (devRunMods + ["exmachina-${exmachina_version}.jar"]).collect { new File(localMods, it) }

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Stands read mod internals the stand-ins leave out, so under -Pgt6probes everything compiles against real jars.
    if (project.hasProperty('gt6probes')) {
        compileOnly files(probeCompileMods)
    } else {
        compileOnly sourceSets.provided.output
    }
    def devRunJars = devRunMods.collect { new File(localMods, it) }
    // A mistyped file name would otherwise start the game without the mod and without a word.
    if (localMods.isDirectory()) devRunJars.findAll { !it.isFile() }.each { logger.lifecycle("[mods] absent from ${localMods.name}, runs go without it: ${it.name}") }
    localRuntime files(devRunJars.findAll { it.isFile() })

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // --- Test tooling (absent from the MDK template; added for gregtech6-neo) ---
    // JUnit 5 — headless unit tests for pure logic (./gradlew test).
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // NeoForge test framework — unit tests running in an MC-server context (headless registries),
    // the class is annotated @ExtendWith(EphemeralTestServerProvider.class).
    testImplementation "net.neoforged:testframework:${neo_version}"
}

// TWO PROJECT MODES — split apart deliberately (see the README's "Development tooling").
//
//   PRODUCT (default): `gradlew build` / `gradlew test` — checks on the mod BY ITSELF.
//     Need nothing beyond the repository, work for anyone who cloned it, and serve as the CI gate.
//
//   PORT-PHASE RIG (opt-in only): diffing against the original (`test -Pgt6.oracle=<path>`) and live
//     stands (`-Pgt6probes`). They answer "does this match the original," which needs dumps of the
//     live 1.7.10 (~200 MB, not part of the repository). The port phase is closed: the question now
//     comes up when investigating a discrepancy, not on every run.
//
// The phase's tooling is NEITHER thrown away NOR shipped — it's switched to opt-in. Parity is enabled
// by the PRESENCE of a path to the original's dumps — no separate task is set up: the build plugin only
// configures the Minecraft test environment for the stock `test` task, and a homemade Test task neither
// inherits it nor starts at all (verified). One mechanism instead of two:
//     gradlew test                         -> checks on the mod by itself (no reference needed)
//     gradlew test -Pgt6.oracle=<path>     -> plus a diff against the live 1.7.10 dumps
def oraclePath = project.findProperty('gt6.oracle')

// TESTS ARE ALSO OUTSIDE THE REPOSITORY (owner decision 2026-08-12: "all tests and stands live outside
// the repository; only the agreed minimum stays inside"). A test is an instrument, not the product, and
// that applies to both the JUnit tests and the original-diffing machinery. Both live alongside the repo:
// ../stands/*/test-java (+ test-resources), wired in if the directory exists. Clone only the repository
// and there are no tests at all — `gradlew build` simply builds the mod.
//
// The original diff is further gated by the `parity` tag: its code is wired in the same way, but the
// actual checks only run given a path to the live 1.7.10 dumps (see the test block below).
file('../stands').listFiles()?.each { d ->
    File tSrc = new File(d, 'test-java')
    File tRes = new File(d, 'test-resources')
    if (tSrc.isDirectory()) {
        sourceSets.test.java.srcDir(tSrc)
        logger.lifecycle("[test] external tests wired in: ${d.name}")
    }
    if (tRes.isDirectory()) sourceSets.test.resources.srcDir(tRes)
}

test {
    useJUnitPlatform {
        if (!oraclePath) excludeTags 'parity'
    }
    if (oraclePath) systemProperty 'gt6.oracle', oraclePath.toString()
    // Tests boot the WHOLE mod (thousands of items and recipes). On the default heap the process fails
    // with OutOfMemoryError already during loading, and then every check goes red at once — not because
    // the code is wrong, but because the mod never finished loading.
    maxHeapSize = '6G'
    doFirst {
        logger.lifecycle(oraclePath
            ? "[test] original-diff mode: dumps at ${oraclePath}"
            : "[test] product mode: checks on the mod by itself (diff against the original — test -Pgt6.oracle=<path>)")
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs << '-Xmaxerrs' << '100000' // TEMPORARY (core port): lift the 100-error cap to see the tail across all seams
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Prints the main compileClasspath — for cases where a subset of sources needs to be built with a
// separate compiler invocation, bypassing Gradle (seam diagnostics).
tasks.register('printCompileCp') {
    def cp = sourceSets.main.compileClasspath
    doLast {
        println "COMPILE_CP_START"
        println cp.asPath
        println "COMPILE_CP_END"
    }
}
