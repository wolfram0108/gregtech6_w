plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    exclude("src/generated/**/.cache") // datagen cache files
}

// F10 (decisions/F10-external-mod-compat.md §3.2): ЦЕНТРАЛЬНОЕ ЗЕРКАЛО чужих API — единственная точка,
// где живут compile-only декларации интерфейсов внешних модов (IC2/AE2/…), которые GregTech6 реализует.
// Держит ядро компилируемым, пока интеграция с модами ОТЛОЖЕНА. Возврат к реальной интеграции = удалить
// этот каталог и подключить настоящие зависимости — в ОДНОМ месте. Аналог compileOnly dev-jar'ов оракула.
sourceSets.main.java.srcDir('src/compat-mirror/java')

// -PcoreOnly (ОБРАТИМО, opt-in): сузить main.java до ядра-692 + mirror (917 файлов), исключив контент-слой
// (568 файлов, 2860 ошибок компиляции). Нужно, чтобы `./gradlew test -PcoreOnly` собрался и запустил PortDump-@Test
// в FML-runtime (единственный контекст, где заводится FMLLoader → parity-судья material/prefix). Обычная сборка
// (без -PcoreOnly) НЕ тронута. Снять фильтр, когда контент-слой начнёт компилироваться. См. STATE.md «ПАРИТЕТ-ОСНАСТКА».
if (project.hasProperty('coreOnly')) {
    def toRel = { line ->
        def p = line.trim().replace('\\', '/')
        int i = p.indexOf('src/main/java/')
        if (i >= 0) return p.substring(i + 'src/main/java/'.length())
        int j = p.indexOf('src/compat-mirror/java/')
        if (j >= 0) return p.substring(j + 'src/compat-mirror/java/'.length())
        return null
    }
    def includes = []
    file('core_unit_v2_files.txt').eachLine { def r = toRel(it); if (r) includes << r }
    file('mirror_files.txt').eachLine { def r = toRel(it); if (r) includes << r }
    sourceSets.main.java.setIncludes(includes)
    // SanityTest завязан на контент-класс GregTech6.MODID (исключён фильтром) — не компилировать под coreOnly.
    sourceSets.test.java.exclude('**/SanityTest.java')
    // JPMS split-package: compat-mirror кладёт crutch-классы в net.minecraft.*/cpw.* (IIcon/IIconRegister/RenderBlocks/
    // TileEntityFlowerPot/launchwrapper/cpw.mods.fml) — конфликт с реальными модулями minecraft/modlauncher при
    // module-resolution FML. Они нужны только на КОМПИЛЯЦИИ; в рантайме material/prefix-дамп (server-side, без рендера)
    // их не вызывает (ленивая линковка). Стрипаем .class из вывода ПОСЛЕ compile, ДО test → модуль gregtech6 не экспортирует
    // эти пакеты → конфликт исчезает, GT6-импорты остаются verbatim-1:1 (код не тронут). Дёрнет рантайм → NoClassDefFound (тогда --patch-module).
    // stripMcMirror удаляет .class из вывода → это ломает ИНКРЕМЕНТАЛЬНУЮ компиляцию на след. прогоне (gradle видит
    // выход изменённым, но incremental-анализ путается: cpw.*/net.minecraft.* «package does not exist»). Полная компиляция
    // регенерит миражи каждый раз → strip снова удаляет → консистентно. Под coreOnly компилируем 918 файлов (~15с) — ок для итераций.
    tasks.named('compileJava').configure { options.incremental = false }
    def stripMirror = tasks.register('stripMcMirror') {
        doLast {
            def dir = file('build/classes/java/main')
            def removed = 0
            ['net/minecraft', 'cpw'].each { pkg ->
                def t = file("$dir/$pkg")
                if (t.exists()) { removed += fileTree(t).files.size(); delete t }
            }
            logger.lifecycle("[coreOnly] stripMcMirror: удалено ${removed} crutch-.class из рантайм-модуля")
        }
    }
    tasks.named('stripMcMirror').configure { mustRunAfter tasks.named('classes') }
    tasks.named('test').configure { dependsOn stripMirror }
    logger.lifecycle("[coreOnly] main.java сужен до ${includes.size()} файлов (ядро-692 + mirror); SanityTest исключён")
}

// -PparityFull: контент-слой ТЕПЕРЬ КОМПИЛИРУЕТСЯ (3903→0) -> main НЕ сужаем (полный контент для контент-зависимых
// fluid/registeredCounts паритета), но JPMS split-package остаётся -> тот же stripMcMirror (удаляем net.minecraft/cpw
// crutch-.class ПОСЛЕ compile, ДО test). Material/prefix-дамп server-side без рендера мираж не зовёт (ленивая линковка);
// дёрнет рантайм → NoClassDefFound (тогда --patch-module конкретного пакета). Обычная сборка (без флага) НЕ тронута.
if (project.hasProperty('parityFull')) {
    tasks.named('compileJava').configure { options.incremental = false }
    def stripMirrorFull = tasks.register('stripMcMirrorFull') {
        doLast {
            def dir = file('build/classes/java/main')
            def removed = 0
            ['net/minecraft', 'cpw'].each { pkg ->
                def t = file("$dir/$pkg")
                if (t.exists()) { removed += fileTree(t).files.size(); delete t }
            }
            logger.lifecycle("[parityFull] stripMcMirrorFull: удалено ${removed} crutch-.class из рантайм-модуля")
        }
    }
    tasks.named('stripMcMirrorFull').configure { mustRunAfter tasks.named('classes') }
    tasks.named('test').configure { dependsOn stripMirrorFull }
    sourceSets.test.java.exclude('**/SanityTest.java')
    logger.lifecycle("[parityFull] полный контент + stripMcMirror для JPMS")
}

repositories {
    // Add here additional repositories if required by some of the dependencies below.

    // JEI (mezz.jei) — просмотрщик рецептов/предметов для визуальной приёмки. Репозиторий выверен по AE2.
    maven {
        url = 'https://maven.blamejared.com/'
        content { includeGroup 'mezz.jei' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    // Specify the version of NeoForge to use.
    version = project.neo_version

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            clientData()

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }

    // Юнит-тесты ModDevGradle: настраивает sourceSet 'test' с Minecraft на classpath.
    unitTest {
        enable()
        testedMod = mods."${mod_id}"
    }
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // JEI (аналог NEI) — инструмент визуальной приёмки. Координаты выверены по AE2, метаданные резолвятся.
    // compileOnly-строки временно закомментированы: скачивание jar с maven.blamejared.com в этой среде
    // отваливается по таймауту, а на compileClasspath они БЛОКИРУЮТ компиляцию ядра (которое JEI пока не
    // импортирует — плагинов ещё нет). Раскомментировать при написании JEI-плагинов GregTech6 / когда сеть
    // до blamejared будет стабильна. localRuntime оставлен (он на runtime-пути, компиляцию не трогает;
    // подтянет полный JEI при запуске игры для приёмки визуала).
    // compileOnly "mezz.jei:jei-${jei_minecraft_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${jei_minecraft_version}-neoforge-api:${jei_version}"
    localRuntime "mezz.jei:jei-${jei_minecraft_version}-neoforge:${jei_version}"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // --- Тестовый инструментарий (в MDK-шаблоне отсутствует; добавлено под gregtech6-neo) ---
    // JUnit 5 — headless-юнит-тесты чистой логики (./gradlew test).
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // NeoForge test framework — юнит-тесты в контексте MC-сервера (headless-реестры),
    // класс помечается @ExtendWith(EphemeralTestServerProvider.class).
    testImplementation "net.neoforged:testframework:${neo_version}"
}

// JUnit Platform для задачи test.
test {
    useJUnitPlatform()
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
neoForge.ideSyncTask generateModMetadata

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs << '-Xmaxerrs' << '100000' // ВРЕМЕННО (порт ядра): снять потолок в 100 ошибок, чтобы видеть хвост по всем швам
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// ОСНАСТКА ИЗОЛЯЦИИ ЯДРА (порт, паритет-первый заход): печать compileClasspath main,
// чтобы компилировать ровно подмножество ядра-403 отдельным javac (см. core_unit_files.txt).
tasks.register('printCompileCp') {
    def cp = sourceSets.main.compileClasspath
    doLast {
        println "COMPILE_CP_START"
        println cp.asPath
        println "COMPILE_CP_END"
    }
}
