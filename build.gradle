plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev.legacyforge' version '2.0.141'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    // Include resources generated by data generators.
    srcDir('src/generated/resources')

    // Exclude common development only resources from finalized outputs
    exclude("**/*.bbmodel") // BlockBench project files
    // The exclude pattern is relative to the resource root, not the project root, so the old "...cache" glob
    // never matched, and datagen's cache leaked into the jar.
    exclude("**/.cache/**")
    // The original keeps the artist's own asset-prep tooling next to textures (e.g. copy_into_dull.bat).
    // Kept in source (repo mirrors the original 1:1) but excluded from the jar: hosting sites reject executables.
    exclude("**/*.bat", "**/*.cmd", "**/*.com", "**/*.exe", "**/*.msi", "**/*.scr",
            "**/*.vbs", "**/*.ps1", "**/*.sh", "**/*.bin", "**/*.dll", "**/*.so")
}

// Central mirror of foreign mod APIs (IC2/AE2/…) that GregTech6 implements, holding compile-only declarations.
// Keeps the core compilable while integration is deferred; returning to it means wiring the real dependency here.
sourceSets.main.java.srcDir('src/compat-mirror/java')
// Mods present at runtime as real jars (JEI, Jade, AE2, More Red) compile against stand-ins declared here.
// Those jars own the packages at runtime, so the set builds apart and never enters the mod's output or jar.
sourceSets { provided { java.srcDir('src/compat-mirror/provided') } }

// GT6U addon: a second mod in its own source set and jar, compiled against GregTech 6 and never the other way round.
// Runs and tests load it only with -Pgt6u; without the flag every run is pure GregTech 6.
def withGt6u = project.hasProperty('gt6u')
sourceSets {
    gt6u {
        // src/gt6u/java and src/gt6u/resources by Gradle's convention for a source set named gt6u.
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}
configurations {
    gt6uCompileOnly.extendsFrom compileOnly
    gt6uImplementation.extendsFrom implementation
    // Gradle 9 hands the source-set variant configurations to the main set only, while the legacy reobfuscation pass
    // reads them by name off whatever source set it is given (ObfuscationExtension.reobfuscate). The addon's two are
    // spelled out with the shape the java plugin gives main's, so the call finds them instead of failing on the name.
    gt6uApiElements {
        canBeConsumed = true
        canBeResolved = false
    }
    gt6uRuntimeElements {
        canBeConsumed = true
        canBeResolved = false
    }
}
// Declaring the two by hand is not enough: the publishing component only knows the variants the java plugin registered
// itself, and the reobfuscation call registers its own remapped variant against the same component. Both are therefore
// registered here as well, with no artifact of their own (the addon is its own mod and its own jar, not a published
// variant of GregTech 6), so the graph resolves and `publish` behaves exactly as before.
components.java {
    addVariantsFromConfiguration(configurations.gt6uApiElements) { }
    addVariantsFromConfiguration(configurations.gt6uRuntimeElements) { }
}

// The -PcoreOnly mode is gone with the mass-compilation phase it served: it narrowed the build to two file lists.

// -PparityFull is gone: a second way to say "diff against the original" that only added confusion.
// Parity now turns on by pointing at the original's dumps.

// The same JPMS split-package crutch classes (net.minecraft.* and cpw.* from compat-mirror) that break test
// also break dev-run module resolution, so they're stripped from build output after compile, before run.
tasks.named('compileJava').configure { options.incremental = false }
// One task for the whole project: dev runs and tests strip the same crutch classes from the same output.
// Two separate copies had drifted (one supported the configuration cache, the other didn't, breaking dev runs).
def mirrorDirs = ['net/minecraft', 'cpw'].collect { file("build/classes/java/main/$it") }
def stripCompatMirror = tasks.register('stripCompatMirror') {
    description = 'Снять compile-only зеркала (net.minecraft, cpw) из рантайм-вывода: их пакетами владеет движок'
    doLast {
        int removed = 0
        mirrorDirs.each { d ->
            if (d.exists()) {
                d.eachFileRecurse { if (it.isFile()) removed++ }
                d.deleteDir()
            }
        }
        println("[strip] снято ${removed} crutch-.class из рантайм-модуля")
    }
}
stripCompatMirror.configure {
    mustRunAfter tasks.named('classes')
    // Every source set still needs the compile-only mirrors while javac is running.
    mustRunAfter tasks.withType(JavaCompile)
}
['runClient', 'runData', 'runServer', 'runGameTestServer'].each { rn ->
    tasks.matching { it.name == rn }.configureEach { dependsOn stripCompatMirror }
}
tasks.named('test').configure { dependsOn stripCompatMirror }

// Debug-probe flag files in run/ only take effect when launched with -Pgt6probes.
// A normal player run never reads probes/auto-world-join, even if a flag file is accidentally left behind.
if (project.hasProperty('gt6probes')) {
    // Test tooling lives outside the repository: only the product ships here. src/probes and src/gametest held
    // a snapshot of the 26.1.2 rig, carried over when this branch split off.
    file('../stands-1.20.1').listFiles()?.each { d ->
        if (new File(d, 'java').isDirectory()) sourceSets.main.java.srcDir("${d}/java")
    }
    ['runClient', 'runData', 'runServer', 'runGameTestServer'].each { rn ->
        tasks.matching { it.name == rn }.configureEach { it.jvmArgs('-Dgt6.probes=true')
            // Passes stand parameters through (e.g. -Pgt6.probeArgs=gt6.drainprobe.kind=1).
            if (project.hasProperty('gt6.probeArgs')) project.property('gt6.probeArgs').toString().split(',').each { a -> it.jvmArgs('-D' + a) } }
    }
    logger.lifecycle("[gt6probes] оснастка проверки ВКЛЮЧЕНА: стенды + GameTest'ы (-Dgt6.probes=true)")
}

// Same JPMS split-package issue as the run and test tasks, but without a fix it broke the real modular launcher:
// net.minecraft.* and cpw.* packages built by compat-mirror are owned by real modules at runtime.
tasks.named('jar').configure {
    exclude 'net/minecraft/**'
    exclude 'cpw/**'
    // Forge 1.20.1 (47.4.22) doesn't read the [[mixins]] section from mods.toml (that's neo's channel, branch main).
    // The real channel here is the MixinConfigs manifest attribute.
    manifest { attributes(['MixinConfigs': 'gregapi.mixins.json']) }
}

// In dev runs the legacyforge plugin's MixinExtension.config(...) adds --mixin.config=<name> to run arguments.
// Before this line, debug.log never logged the mixin config, since the dev layout's MANIFEST.MF isn't read.
mixin {
    config 'gregapi.mixins.json'
    // Dev runtime uses mojmap names and needs no refmap, but Forge 1.20.1's production jar runs on SRG names.
    // add(sourceSet, name) wires the plugin's own annotation processor; branch main's runtime and jar share names.
    add(sourceSets.main, 'gregapi.refmap.json')
}

// The mixin processor writes refmap and the name map into build/mixin, not declared as a compileJava output.
// Cached compileJava doesn't restore it, and reobfJar fails on a missing .mappings.tsrg; declaring it fixes both.
tasks.named('compileJava') {
    outputs.dir(layout.buildDirectory.dir('mixin')).withPropertyName('mixinRefmapDir')
}

// By default zip entries carry file time and traversal order, so two builds of one commit differ.
// These three settings make the jar byte-for-byte reproducible, so a checksum proves what it was built from.
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
    dirPermissions { unix(0755) }
    filePermissions { unix(0644) }
}

// Production names: the renamer shares one method record across a type family and mutates it while
// classes are written in parallel, so an engine name leaking into a mod type lands on a random subset.
def reobfPins = file('gradle/reobf-pins.tsrg')
tasks.matching { it.name == 'reobfJar' }.configureEach {
    // Pinned families get their engine name before the parallel pass, identically on every machine.
    remapOperation.mappings.from(reobfPins)
    doLast { task ->
        def log = new File(task.temporaryDir, 'console.log')
        if (!log.isFile()) throw new GradleException("[reobf] renamer log is missing: ${log}")
        def modJar = new java.util.zip.ZipFile(task.input.get().asFile)
        def libJars = task.libraries.files.findAll { it.name.endsWith('.jar') }.collect { new java.util.zip.ZipFile(it) }
        def headerParents = { byte[] bytes ->
            def din = new DataInputStream(new ByteArrayInputStream(bytes))
            din.skipBytes(8)
            int count = din.readUnsignedShort()
            def utf = [:], cls = [:]
            for (int k = 1; k < count; k++) {
                int tag = din.readUnsignedByte()
                switch (tag) {
                    case 1: utf[k] = din.readUTF(); break
                    case 7: cls[k] = din.readUnsignedShort(); break
                    case [8, 16, 19, 20]: din.skipBytes(2); break
                    case 15: din.skipBytes(3); break
                    case [3, 4, 9, 10, 11, 12, 17, 18]: din.skipBytes(4); break
                    case [5, 6]: din.skipBytes(8); k++; break
                    default: throw new GradleException("[reobf] unknown constant tag ${tag}")
                }
            }
            din.skipBytes(4)
            int sup = din.readUnsignedShort()
            def out = sup ? [utf[cls[sup]]] : []
            din.readUnsignedShort().times { out << utf[cls[din.readUnsignedShort()]] }
            out
        }
        def modNames = modJar.entries().findAll { it.name.endsWith('.class') }.collect { it.name[0..-7] } as Set
        def libIndex = [:]
        libJars.each { z -> z.entries().each { e -> if (e.name.endsWith('.class')) libIndex.putIfAbsent(e.name[0..-7], { -> z.getInputStream(e).bytes }) } }
        // Class directories are libraries too: the compile-only stand-ins arrive that way.
        task.libraries.files.findAll { it.isDirectory() }.each { d ->
            d.eachFileRecurse(groovy.io.FileType.FILES) { f ->
                if (f.name.endsWith('.class')) libIndex.putIfAbsent(d.toPath().relativize(f.toPath()).toString().replace(File.separator, '/')[0..-7], { -> f.bytes })
            }
        }
        def parentCache = [:]
        def parentsOf = { String name ->
            if (!parentCache.containsKey(name)) {
                def read = modNames.contains(name) ? { -> modJar.getInputStream(modJar.getEntry(name + '.class')).bytes } : libIndex[name]
                parentCache[name] = read ? headerParents(read()) : []
            }
            parentCache[name]
        }
        // A propagation is safe only when the name comes from an ancestor of the renamed type.
        def event = ~/Conflicting propagated mapping for (\S+)\/([^\/(]+)(\(\S*) from (\S+)\/[^\/(]+\(\S* ?: (\S+) -> (\S+)/
        int events = 0
        def unsafe = []
        log.eachLine('UTF-8') { line ->
            def m = line =~ event
            if (!m.find()) return
            events++
            String owner = m.group(1), source = m.group(4)
            if (!modNames.contains(owner)) return
            def seen = [] as Set, stack = [owner]
            while (stack) { parentsOf(stack.remove(stack.size() - 1)).each { if (seen.add(it)) stack << it } }
            if (!seen.contains(source)) unsafe << "${owner} ${owner}\n\t${m.group(2)} ${m.group(3)} ${m.group(6)}    (leaked from ${source})"
        }
        ([modJar] + libJars)*.close()
        if (unsafe) throw new GradleException("[reobf] ${unsafe.size()} engine name(s) leaked into mod types; " +
                "pin each family in ${reobfPins.name}:\n" + unsafe.join('\n'))
        task.logger.lifecycle("[reobf] propagation events ${events}, unsafe 0")
    }
}

repositories {
    // No mod repositories: the build downloads only the platform (Gradle, NeoForge, Minecraft, their libraries).
    // A foreign mod API compiles from src/compat-mirror/provided, a foreign mod jar comes from ../stands-1.20.1/_mods.
}
// The legacy plugin also adds maven.minecraftforge.net unfiltered; nothing is taken from it, so it is never asked.
// Matched by host, not by the name the plugin happens to give the repository.
repositories.removeAll { it instanceof MavenArtifactRepository && it.url.host == 'maven.minecraftforge.net' }

base {
    archivesName = mod_id
}

// Mojang ships Java 25 to end users in 26.1.2, so mods should target Java 25.
java.toolchain.languageVersion = JavaLanguageVersion.of(17)   // Forge 1.20.1 = Java 17

legacyForge {
    // NeoForge 1.20.1 (47.1.x) forks Forge 47.1.3: same net.minecraftforge packages, same mods.toml.
    // So branch code against the 1.20.1 API stays valid; version=... means MinecraftForge, NeoForge needs enable{}.
    enable {
        neoForgeVersion = project.neoforge_version
    }

    // This line is optional. Access Transformers are automatically detected
    // accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    // Default run configurations.
    // These can be tweaked, removed, or duplicated as needed.
    runs {
        client {
            client()

            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            // Item DataComponents aren't bound in the main menu, only on world-load, so the render-probe needs a loaded world.
            // Disabled here for a normal launch; auto-join lives in the stand tooling (-Pgt6probes) instead.
            // programArguments.addAll '--quickPlaySingleplayer', 'GT6WGTest'
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Dedicated server gets its own game directory: a simultaneous runClient sharing run/ fights over log files
            // (Windows file lock), and the acceptance judge reads garbled output.
            gameDirectory = project.file('runserver')
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            // Its own directory: without it a run dumped logs/, config/ and .cache/ into the repository root.
            gameDirectory = project.file('rungametest')
        }

        data {
            data() // 1.20.1: datagen run type is 'data' (clientData is a 26.x split); types are client/data/gameTestServer/server.

            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // gameDirectory = project.file('run-data')

            // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
            // GatherDataEvent only fires on mod buses listed in --mod, and datapack providers subscribe on the gregapi bus,
            // not gregtech6 (which has no @Mod class).
            programArguments.addAll '--mod', 'gregapi', '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        // applies to all the run configs above
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        // define mod <-> source bindings
        // these are used to tell the game which sources are for which mod
        // multi mod projects should define one per mod
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
        if (withGt6u) {
            gt6u {
                sourceSet(sourceSets.gt6u)
            }
        }
    }

    // The legacyForge extension has no unitTest{} block; removed since this run's goal is core compilation.
}
legacyForge.addModdingDependenciesTo(sourceSets.provided)
// The addon's source set is handed Minecraft and Forge the same way, and only when it is part of the build at all.
if (withGt6u) legacyForge.addModdingDependenciesTo(sourceSets.gt6u)

// Local mode: NeoFormRuntime takes the game from the platform copy beside the repository instead of asking Mojang.
// Its manifests under minecraft/resolved point every address at a file of that copy.
if (gradle.platformCopy) {
    neoFormRuntime.launcherManifestUrl = new File(gradle.platformCopy, 'minecraft/resolved/launcher_manifest.json').toURI().toString()
    // The 1.20.1 pipeline names its tools inside mcp_config, and NeoFormRuntime downloads whatever its artifact
    // manifest lacks. Gradle resolves them here, one configuration each: two versions of one tool are both needed.
    def pipelineTools = [
        'de.oceanlabs.mcp:mcp_config:1.20.1-20230612.114412@zip',
        'net.minecraftforge:ForgeAutoRenamingTool:1.0.2:all',
        'net.minecraftforge:forgeflower:2.0.629.0',
        'net.minecraftforge:installertools:1.2.0:fatjar',
        'net.minecraftforge:installertools:1.3.2:fatjar',
        'net.minecraftforge:mergetool:1.1.7:api',
        'org.jetbrains:annotations:24.0.1',
    ].collect { notation ->
        def tool = configurations.detachedConfiguration(dependencies.create(notation))
        tool.transitive = false
        tool
    }
    tasks.withType(net.neoforged.nfrtgradle.NeoFormRuntimeTask).configureEach { task ->
        pipelineTools.each { task.addArtifactsToManifest(it) }
    }
    tasks.withType(net.neoforged.nfrtgradle.DownloadAssets).configureEach {
        doFirst {
            if (!System.getenv('NFRT_ASSET_REPOSITORY')) {
                throw new GradleException('Local mode starts through gradlew: it tells NeoFormRuntime where the game assets are.')
            }
        }
    }
}

// Foreign mods are never fetched: they sit beside the repository, and a bare clone builds and runs GregTech alone.
def localMods = gradle.localMods
// The SRG-to-named remap accepts module notation only, so the folder is read as a local flat repository,
// declared once in settings.gradle. In local mode the settings repositories already hold it.
if (!gradle.platformCopy) gradle.ext.localModsRepository.call(repositories)
// Each entry is [name, version]; the jar in the folder is <name>-<version>.jar.
def devRunMods = [
    // JEI is the visual-acceptance viewer; Jade, JourneyMap, AE2, More Red and BuildCraft are what the compat stands query.
    ["jei-${jei_minecraft_version}-forge", jei_version],
    ['jade', jade_version],
    ['journeymap', journeymap_version],
    ['ae2', ae2_version],
    ['guideme', guideme_version],
    ["morered-${minecraft_version}", morered_version],
    // More Red embeds these two, but the dev runtime doesn't unpack embedded jars.
    ["useitemonblockevent-${minecraft_version}", useitemonblockevent_version],
    ["jumbofurnace-${minecraft_version}", jumbofurnace_version],
    ['buildcraft', buildcraft_version],
].collect { n, v -> [notation: "localmods:${n}:${v}", jar: new File(localMods, "${n}-${v}.jar")] }
def probeCompileMods = devRunMods*.jar

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

// Production jars of foreign mods call the engine by SRG names, but this build's dev runtime uses named mappings.
// createRemappingConfiguration remaps mod dependencies SRG→official; mod configs aren't transitive.
obfuscation.createRemappingConfiguration(configurations.localRuntime)

dependencies {
    // The mixin{add(...)} block only configures the processor's arguments, not the annotationProcessor entry itself.
    // Without this line the name map isn't produced, and reobfJar fails with a missing .mappings.tsrg.
    annotationProcessor 'org.spongepowered:mixin:0.8.5'
    // The mixin-0.8.5 POM doesn't declare its own transitive deps (shaded for runtime), so the processor-path
    // needs them listed explicitly, or it crashes with NoClassDefFoundError.
    annotationProcessor 'com.google.code.gson:gson:2.10.1'
    annotationProcessor 'com.google.guava:guava:31.1-jre'
    annotationProcessor 'org.ow2.asm:asm:9.9.1'
    annotationProcessor 'org.ow2.asm:asm-tree:9.9.1'
    annotationProcessor 'org.ow2.asm:asm-commons:9.9.1'
    annotationProcessor 'org.ow2.asm:asm-util:9.9.1'
    annotationProcessor 'org.ow2.asm:asm-analysis:9.9.1'
    annotationProcessor 'commons-io:commons-io:2.20.0'

    // Stands read mod internals the stand-ins leave out, so under -Pgt6probes everything compiles against real jars.
    if (project.hasProperty('gt6probes')) {
        compileOnly files(probeCompileMods)
    } else {
        compileOnly sourceSets.provided.output
    }
    // Production jars call the engine by SRG names, so dev runs load them through the SRG-to-named remap.
    // A mistyped file name would otherwise start the game without the mod and without a word.
    if (localMods.isDirectory()) devRunMods.findAll { !it.jar.isFile() }.each { logger.lifecycle("[mods] absent from ${localMods.name}, runs go without it: ${it.jar.name}") }
    devRunMods.findAll { it.jar.isFile() }.each { modLocalRuntime it.notation }

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html

    // Test tooling absent from the MDK template, added for gregtech6-neo.
    // JUnit 5 runs headless unit tests of pure logic (./gradlew test).
    testImplementation platform("org.junit:junit-bom:${junit_version}")
    testImplementation "org.junit.jupiter:junit-jupiter"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    // NeoForge's testframework for 1.20.1 doesn't exist; removed since this run's goal is core compilation.
}

// Two deliberately separate modes: the default gradlew build/test checks the mod on its own.
// Parity/live-stand tooling turns on only on request, since it needs the original's large local dumps.
file('../stands-1.20.1').listFiles()?.each { d ->
    if (new File(d, 'test-java').isDirectory()) sourceSets.test.java.srcDir("${d}/test-java")
}

def oraclePath = project.findProperty('gt6.oracle')
test {
    useJUnitPlatform {
        if (!oraclePath) excludeTags 'parity'
    }
    if (oraclePath) systemProperty 'gt6.oracle', oraclePath.toString()
    // Tests boot the whole mod (thousands of items and recipes); on the default heap the process runs out
    // of memory while loading, and every check turns red — not because the code is wrong.
    maxHeapSize = '6G'
    doFirst {
        logger.lifecycle(oraclePath
            ? "[test] режим сверки с оригиналом: дампы ${oraclePath}"
            : "[test] продуктовый режим: проверки мода самого по себе (сверка с оригиналом — test -Pgt6.oracle=<путь>)")
    }
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
var modMetadataProperties = [
        minecraft_version      : minecraft_version,
        minecraft_version_range: minecraft_version_range,
        forge_version          : forge_version,
        neoforge_version_range : neoforge_version_range,
        mod_id                 : mod_id,
        mod_name               : mod_name,
        mod_license            : mod_license,
        mod_version            : mod_version,
]
var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    inputs.properties modMetadataProperties
    expand modMetadataProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}
// Include the output of "generateModMetadata" as an input directory for the build
// this works with both building through Gradle and the IDE.
sourceSets.main.resources.srcDir generateModMetadata
// To avoid having to run "generateModMetadata" manually, make it run on every project reload
legacyForge.ideSyncTask generateModMetadata

// The addon versions independently; its dependency still names the exact GregTech build.
// Forge 1.20.1 reads the template as META-INF/mods.toml (neoforge.mods.toml is the 26.x name), so the addon's template follows that.
def gt6uMetadataProperties = modMetadataProperties + [gt6u_version: gt6u_version]
var generateGt6uMetadata = tasks.register("generateGt6uMetadata", ProcessResources) {
    inputs.properties gt6uMetadataProperties
    expand gt6uMetadataProperties
    from "src/gt6u/templates"
    into "build/generated/sources/gt6uMetadata"
}
sourceSets.gt6u.resources.srcDir generateGt6uMetadata
// The addon's jar, built only with -Pgt6u: GregTech 6's build/libs, its jar check and its release stay as they were.
// The plugin sends the jar handed to reobfuscate() to build/devlibs (the same intermediate directory the main jar uses),
// so the shipped addon jar is the remapped one below, in its own build/libs-gt6u.
var gt6uJar = tasks.register('gt6uJar', Jar) {
    archiveBaseName = 'gt6u'
    archiveVersion = gt6u_version
    from sourceSets.gt6u.output
}
// A second production jar needs the same SRG pass as the main one, so the addon costs one more call of the same plugin shape.
// reobfuscate() names the task after the jar it remaps -> reobfGt6uJar; it also redirects the named jar it is handed to
// build/devlibs (the plugin's dev-jar directory for the main jar), so only the remapped output is re-pointed here:
// build/libs-gt6u holds the production addon jar, exactly like build/libs holds GregTech 6's.
var reobfGt6uJar = obfuscation.reobfuscate(gt6uJar, sourceSets.gt6u)
reobfGt6uJar.configure { destinationDirectory.set(layout.buildDirectory.dir('libs-gt6u')) }
// gt6uJar is finalized by reobfGt6uJar (the plugin wires that itself), so asking for the jar does produce the production one.
if (withGt6u) tasks.named('assemble') { dependsOn gt6uJar }

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
    options.compilerArgs << '-Xmaxerrs' << '100000' // Error cap raised above the usual 100, to see the whole tail of failures across every seam during the port.
    // javac forks as its own process with its own memory: with tens of thousands of errors the compiler
    // held them all in the daemon's own heap and crashed the Gradle daemon itself.
    options.fork = true
    options.forkOptions.memoryMaximumSize = '12g'
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}

// Prints main's compileClasspath, for compiling a subset of sources with a standalone compiler call,
// outside Gradle (seam diagnostics).
tasks.register('printCompileCp') {
    def cp = sourceSets.main.compileClasspath
    doLast {
        println "COMPILE_CP_START"
        println cp.asPath
        println "COMPILE_CP_END"
    }
}
