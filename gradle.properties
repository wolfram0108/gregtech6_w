# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# Xmx поднят с 1G: декомпиляция Minecraft (NeoForm/Vineflower) наследует этот -Xmx и на 1G падает с OOM.
org.gradle.jvmargs=-Xmx6G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.20.1]
# Целевой загрузчик ветки — NeoForge (решение пользователя 2026-08-17: платформа проекта — только NeoForge).
# NeoForge 1.20.1 (линейка 47.1.x) — форк Forge 47.1.3: те же пакеты net.minecraftforge и тот же mods.toml,
# поэтому код ветки, написанный против API 1.20.1, остаётся валидным. Артефакты лежат локально:
# reference/backport-1.20/neoforge-1.20.1-47.1.106-{universal,userdev}.jar
neoforge_version=1.20.1-47.1.106
# Диапазон для mods.toml. ⚠ NeoForge 1.20.1 объявляет себя modId="forge" (displayName "NeoForge") и несёт
# ВЕРСИЮ БЕЗ префикса Minecraft — проверено по META-INF/mods.toml его universal-jar. Прежнее значение
# "[1.20.1-47.4.22,)" сравнивалось с "47.x.y" как строка, начинающаяся с 1, то есть пропускало ЛЮБУЮ
# версию загрузчика: гейт существовал, но ничего не проверял.
neoforge_version_range=[47.1.106,)
forge_version=1.20.1-47.4.22

# JEI (аналог NEI) — инструмент ВИЗУАЛЬНОЙ ПРИЁМКИ порта (ранний приоритет, не отложенная совместимость).
# Координаты выверены по эталону AE2 (та же цель 26.1.2). API — для компиляции JEI-плагинов GregTech6,
# полный JEI — в игру (localRuntime) для просмотра блоков/предметов/рецептов при приёмке.
jei_version=15.48.0.183
jei_minecraft_version=1.20.1

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=gregtech6
# The human-readable display name for the mod.
mod_name=GregTech 6
# Лицензия мода. `All Rights Reserved` был дефолтом шаблона MDK и здесь неверен: GregTech 6
# распространяется под LGPL-3.0-or-later (см. LICENSE / COPYING.LESSER), а порт — производная
# работа, то есть обязан идти под той же лицензией. Строка попадает в метаданные мода.
mod_license=LGPL-3.0-or-later
# The mod version. See https://semver.org/
mod_version=6.0.0-1.20.1-alpha.1
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=gregtech6

## Test dependencies
junit_version=5.11.4
jade_version=11.13.3+forge
journeymap_version=1.20.1-6.0.2+forge
# Applied Energistics 2 — слой совместимости GT6 ⇄ AE2 (этап Э0). Версия выбрана не подбором: локальные
# исходники reference/mods/Applied-Energistics-2-1.20.1 стоят РОВНО на релизном теге (git describe --tags →
# forge/v15.4.10, без хвоста), и 15.4.10 же — последняя сборка линейки 1.20.1 на Modrinth. То есть контракт,
# который мы читаем на диске, и артефакт, против которого собираемся, — одно и то же. Диапазон загрузчика у
# неё forge_version_range=[47.1.3,) — наш NeoForge 1.20.1-47.1.106 в него входит.
ae2_version=15.4.10
# GuideME — ОБЯЗАТЕЛЬНАЯ зависимость AE2 (её mods.toml: modId="guideme", mandatory=true, версия из
# gradle.properties самой AE2 — guideme_version=20.1.7). Modrinth-maven транзитивных зависимостей не отдаёт
# (их нет в pom) — объявляем рядом сами, как это сделано на ветке main.
guideme_version=20.1.7
