# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# Xmx поднят с 1G: декомпиляция Minecraft (NeoForm/Vineflower) наследует этот -Xmx и на 1G падает с OOM.
org.gradle.jvmargs=-Xmx6G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.1.2
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[26.1.2]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.1.2.84

# JEI (аналог NEI) — инструмент ВИЗУАЛЬНОЙ ПРИЁМКИ порта (ранний приоритет, не отложенная совместимость).
# Координаты выверены по эталону AE2 (та же цель 26.1.2). API — для компиляции JEI-плагинов GregTech6,
# полный JEI — в игру (localRuntime) для просмотра блоков/предметов/рецептов при приёмке.
jei_version=29.5.0.26
jei_minecraft_version=26.1.2

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=gregtech6
# The human-readable display name for the mod.
mod_name=GregTech 6
# Лицензия мода. `All Rights Reserved` был дефолтом шаблона MDK и здесь неверен: GregTech 6
# распространяется под LGPL-3.0-or-later (см. LICENSE / COPYING.LESSER), а порт — производная
# работа, то есть обязан идти под той же лицензией. Строка попадает в метаданные мода.
mod_license=LGPL-3.0-or-later
# The mod version. See https://semver.org/
mod_version=6.0.0-alpha.5
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=gregtech6

## Test dependencies
junit_version=5.11.4
jade_version=26.1.8+neoforge
journeymap_version=26.1.2-6.0.3+neoforge
# Applied Energistics 2 — слой совместимости GT6 ⇄ AE2 (миссия «AE2», этап Э0). Последняя сборка AE2
# под 26.1.2/neoforge на Modrinth (api.modrinth.com/v2/project/ae2/version, 2026-08-12). GuideME —
# ОБЯЗАТЕЛЬНАЯ зависимость AE2 (neoforge.mods.toml: modId="guideme", versionRange="[…,)"),
# Modrinth-maven транзитивных зависимостей не отдаёт (в pom их нет) — объявляем рядом сами.
ae2_version=26.1.10-beta
guideme_version=26.1.12-beta
