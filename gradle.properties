# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# Xmx raised from 1G: the Minecraft decompilation (NeoForm/Vineflower) inherits this -Xmx and dies with OOM at 1G.
org.gradle.jvmargs=-Xmx6G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=26.1.2
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[26.1.2]
# The Neo version must agree with the Minecraft version to get a valid artifact
neo_version=26.1.2.84

# JEI (the counterpart of NEI) is the tool for VISUAL ACCEPTANCE of the port (an early priority, not
# deferred compatibility). Coordinates verified against the AE2 reference (same 26.1.2 target). The API is
# for compiling the GregTech6 JEI plugins; full JEI goes into the game (localRuntime) so that blocks, items
# and recipes can be browsed during acceptance.
jei_version=29.5.0.26
jei_minecraft_version=26.1.2

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=gregtech6
# The human-readable display name for the mod.
mod_name=GregTech 6
# Mod licence. `All Rights Reserved` was the MDK template default and is wrong here: GregTech 6 is
# distributed under LGPL-3.0-or-later (see LICENSE / COPYING.LESSER), and this port is a derivative work,
# so it must carry the same licence. This line ends up in the mod metadata.
mod_license=LGPL-3.0-or-later
# The mod version. See https://semver.org/
mod_version=6.0.0-alpha.6.3
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=gregtech6

## Test dependencies
junit_version=5.11.4
jade_version=26.1.8+neoforge
journeymap_version=26.1.2-6.0.3+neoforge
# Applied Energistics 2 — the GT6 to AE2 compatibility layer. Latest AE2 build for 26.1.2/neoforge on
# Modrinth (api.modrinth.com/v2/project/ae2/version, 2026-08-12). GuideME is a MANDATORY dependency of AE2
# (neoforge.mods.toml: modId="guideme", versionRange="[...,)"), and the Modrinth maven does not serve
# transitive dependencies (they are absent from the pom), so it is declared here alongside.
ae2_version=26.1.10-beta
exmachina_version=26.1.0.2
guideme_version=26.1.12-beta
