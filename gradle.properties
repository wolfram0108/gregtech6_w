# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
# Raised from 1G: decompiling Minecraft (NeoForm/Vineflower) inherits this -Xmx and runs out of memory at 1G.
org.gradle.jvmargs=-Xmx6G
org.gradle.daemon=true
org.gradle.parallel=true
# Build cache off: javac 17 bakes source offsets into class files, while the cache key ignores line endings.
org.gradle.caching=false
org.gradle.configuration-cache=true
# A JDK is never downloaded: the build uses an installed one, and CI names its JDKs through setup-java's variables.
# 21 is the one ModDevGradle starts NeoFormRuntime on, whatever the mod itself targets.
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.fromEnv=JAVA_HOME_17_X64,JAVA_HOME_21_X64,JAVA_HOME_25_X64

# Environment Properties
# You can find the latest versions here: https://projects.neoforged.net/neoforged/neoforge
# The Minecraft version must agree with the Neo version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.20.1]
# Branch's target loader is NeoForge. NeoForge 1.20.1 (47.1.x) forks Forge 47.1.3: same packages, same mods.toml.
# reference/backport-1.20/neoforge-1.20.1-47.1.106-{universal,userdev}.jar
neoforge_version=1.20.1-47.1.106
# Range for mods.toml. NeoForge 1.20.1 declares modId="forge" with a version carrying no Minecraft prefix.
# The old value was compared as a string starting with "1" against "47.x.y", so it passed any loader version.
neoforge_version_range=[47.1.106,)
forge_version=1.20.1-47.4.22

# JEI (like NEI) is the visual-acceptance viewer; foreign mod versions name the jars in ../stands-1.20.1/_mods.
jei_version=15.48.0.183
jei_minecraft_version=1.20.1

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=gregtech6
# The human-readable display name for the mod.
mod_name=GregTech 6
# Mod license. "All Rights Reserved" was the MDK template's default and wrong here: GregTech 6 ships
# under LGPL-3.0-or-later, and a port is a derivative work bound by the same license.
mod_license=LGPL-3.0-or-later
# The mod version. See https://semver.org/
mod_version=6.0.0-1.20.1-alpha.5
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=gregtech6

## Test dependencies
junit_version=5.11.4
jade_version=11.13.3+forge
journeymap_version=1.20.1-6.0.2+forge
# AE2 matches the local reference sources exactly (release tag forge/v15.4.10), so the contract read is the build target.
ae2_version=15.4.10
# GuideME is AE2's mandatory dependency (mods.toml: mandatory=true, version from AE2's own gradle.properties).
guideme_version=20.1.7
# More Red is RedPower's successor (16-channel wires, logic plates, poles); version checked against the
# reference sources (reference/mods/MoreRed-src-1.20.1, branch 1.20.1).
morered_version=4.0.0.4
# More Red's two mandatory dependencies, loaded separately because the dev runtime doesn't unpack embedded jars.
useitemonblockevent_version=1.0.0.2
jumbofurnace_version=4.0.0.5
